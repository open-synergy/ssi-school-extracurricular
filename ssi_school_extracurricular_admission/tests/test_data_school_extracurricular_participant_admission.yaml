          price_unit: 300000.0

      - step: "Create the customer invoice"
        action: "call"
        target: "term"
        method: "action_create_invoice"
        as_user: "base.user_admin"

      - step: "Delete the draft customer invoice"
        action: "call"
        target: "term"
        method: "action_delete_invoice"
        as_user: "base.user_admin"

      - step: "Assert the term is uninvoiced again"
        action: "assert"
        target: "term"
        asserts:
          customer_invoice_id:
            type: "value"
            operator: "is_falsy"
          state:
            type: "value"
            expected: "uninvoiced"

      - step: "Assert the addendum line is detached from the deleted invoice"
        action: "assert"
        target: "extra"
        asserts:
          customer_invoice_line_id:
            type: "value"
            operator: "is_falsy"

  - name: "Cancel Admission Mode Participant Before Invoice Removes Addendum"
    steps:
      - step: "Setup - create income account"
        action: "create"
        model: "account.account"
        save_as: "income_account"
