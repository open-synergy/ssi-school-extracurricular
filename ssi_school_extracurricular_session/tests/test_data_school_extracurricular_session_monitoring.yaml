options:
  auto_refresh: true

scenarios:
  - name:
      "Confirm gates on the journal, approval creates approval_ids, and approving with
      the coach present reaches done"
    steps:
      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type_sm1"
        values:
          name: "Grade Type Session Monitoring SM1"
          code: "EXTSESSMON-GT-SM1"

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school_sm1"
        values:
          name: "School Session Monitoring SM1"
          code: "EXTSESSMON-SCH-SM1"
          grade_type_id: "REC: grade_type_sm1.id"

      - step: "Setup - create category"
        action: "create"
        model: "school_extracurricular_category"
        save_as: "category_sm1"
        values:
          name: "Category Session Monitoring SM1"
          code: "EXTSESSMON-CAT-SM1"

      - step: "Setup - create extracurricular"
        action: "create"
        model: "school_extracurricular"
        save_as: "extracurricular_sm1"
        values:
          name: "Futsal Club Session Monitoring SM1"
          code: "EXTSESSMON-EXT-SM1"
          category_id: "REC: category_sm1.id"
          school_id: "REC: school_sm1.id"

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year_sm1"
        values:
          name: "AY Session Monitoring SM1"
          code: "EXTSESSMON-AY-SM1"
          date_start: 2026-07-01
          date_end: 2027-06-30

      - step: "Setup - create academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term_sm1"
        values:
          name: "Term Session Monitoring SM1"
          code: "EXTSESSMON-TERM-SM1"
          date_start: 2026-07-01
          date_end: 2026-12-31
          year_id: "REC: academic_year_sm1.id"

      - step: "Setup - create employee for teacher"
        action: "create"
        model: "hr.employee"
        save_as: "employee_sm1"
        values:
          name: "Teacher Employee Session Monitoring SM1"

      - step: "Setup - create teacher"
        action: "create"
        model: "school_teacher"
        save_as: "teacher_sm1"
        values:
          name: "Teacher Session Monitoring SM1"
          code: "EXTSESSMON-TCH-SM1"
          employee_id: "REC: employee_sm1.id"

      - step: "Setup - create product"
        action: "create"
        model: "product.product"
        save_as: "product_sm1"
        values:
          name: "Extracurricular Fee Session Monitoring SM1"

      - step: "Setup - create offering with tracking switches off"
        action: "create"
        model: "school_extracurricular_offering"
        save_as: "offering_sm1"
        values:
          extracurricular_id: "REC: extracurricular_sm1.id"
          academic_year_id: "REC: academic_year_sm1.id"
          academic_term_id: "REC: academic_term_sm1.id"
          teacher_id: "REC: teacher_sm1.id"
          date_start: 2026-07-01
          date_end: 2026-12-31
          product_id: "REC: product_sm1.id"
          price_unit: 150000.0
          participant_attendance_tracked: false
          instructor_attendance_tracked: false

      - step: "Setup - create a user who is a Session Monitor"
        action: "create"
        model: "res.users"
        save_as: "monitor_user_sm1"
        values:
          name: "Session Monitor User SM1"
          login: "session_monitor_sm1@example.com"
          groups_id:
            - - 6
              - 0
              - - "REF:
                  ssi_school_extracurricular_session.school_extracurricular_session_monitor_group"

      - step: "Create a session in planned state"
        action: "create"
        model: "school_extracurricular_session"
        save_as: "session_sm1"
        values:
          offering_id: "REC: offering_sm1.id"
          teacher_id: "REC: teacher_sm1.id"
          date: 2026-08-21
          time_start: 14.0
          time_end: 15.5

      - step: "Negative - confirm is rejected while the journal is empty"
        action: "call"
        target: "session_sm1"
        method: "action_confirm"
        as_user: "base.user_admin"
        expect_error:
          type: "UserError"

      - step: "Fill in the journal"
        action: "write"
        target: "session_sm1"
        values:
          journal_material: "Passing drills and small-sided games."
          journal_activity: "Warm-up, drills, scrimmage, cool-down."

      - step: "Confirm the session"
        action: "call"
        target: "session_sm1"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Assert an approval was raised for the Monitor"
        action: "assert"
        target: "session_sm1"
        asserts:
          approval_ids:
            type: "o2m"
            check: "count"
            expected_count: 1

      - step:
          "Negative - approve is rejected while Coach Present is unchecked and
          Monitoring Note is empty"
        action: "call"
        target: "session_sm1"
        method: "action_approve_approval"
        as_user: "monitor_user_sm1"
        expect_error:
          type: "UserError"

      - step: "Check Coach Present"
        action: "write"
        target: "session_sm1"
        values:
          is_teacher_present: true

      - step: "Approve the session"
        action: "call"
        target: "session_sm1"
        method: "action_approve_approval"
        as_user: "monitor_user_sm1"
        asserts:
          state:
            type: "value"
            expected: "done"

