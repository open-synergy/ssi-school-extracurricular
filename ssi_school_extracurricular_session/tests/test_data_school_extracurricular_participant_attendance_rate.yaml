options:
  auto_refresh: true

scenarios:
  - name: "Attendance rate is 0 with no Done session, then reflects Done sessions"
    steps:
      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type_ar1"
        values:
          name: "Grade Type Attendance Rate AR1"
          code: "EXTATTRATE-GT-AR1"

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school_ar1"
        values:
          name: "School Attendance Rate AR1"
          code: "EXTATTRATE-SCH-AR1"
          grade_type_id: "REC: grade_type_ar1.id"

      - step: "Setup - create category"
        action: "create"
        model: "school_extracurricular_category"
        save_as: "category_ar1"
        values:
          name: "Category Attendance Rate AR1"
          code: "EXTATTRATE-CAT-AR1"

      - step: "Setup - create extracurricular"
        action: "create"
        model: "school_extracurricular"
        save_as: "extracurricular_ar1"
        values:
          name: "Futsal Club Attendance Rate AR1"
          code: "EXTATTRATE-EXT-AR1"
          category_id: "REC: category_ar1.id"
          school_id: "REC: school_ar1.id"

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year_ar1"
        values:
          name: "AY Attendance Rate AR1"
          code: "EXTATTRATE-AY-AR1"
          date_start: 2026-07-01
          date_end: 2027-06-30

      - step: "Setup - create academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term_ar1"
        values:
          name: "Term Attendance Rate AR1"
          code: "EXTATTRATE-TERM-AR1"
          date_start: 2026-07-01
          date_end: 2026-12-31
          year_id: "REC: academic_year_ar1.id"

      - step: "Setup - create employee for teacher"
        action: "create"
        model: "hr.employee"
        save_as: "employee_ar1"
        values:
          name: "Teacher Employee Attendance Rate AR1"

      - step: "Setup - create teacher"
        action: "create"
        model: "school_teacher"
        save_as: "teacher_ar1"
        values:
          name: "Teacher Attendance Rate AR1"
          code: "EXTATTRATE-TCH-AR1"
          employee_id: "REC: employee_ar1.id"

      - step: "Setup - create product"
        action: "create"
        model: "product.product"
        save_as: "product_ar1"
        values:
          name: "Extracurricular Fee Attendance Rate AR1"

      - step: "Setup - create offering"
        action: "create"
        model: "school_extracurricular_offering"
        save_as: "offering_ar1"
        values:
          extracurricular_id: "REC: extracurricular_ar1.id"
          academic_year_id: "REC: academic_year_ar1.id"
          academic_term_id: "REC: academic_term_ar1.id"
          teacher_id: "REC: teacher_ar1.id"
          date_start: 2026-07-01
          date_end: 2026-12-31
          product_id: "REC: product_ar1.id"
          price_unit: 150000.0

      - step: "Setup - create grade"
        action: "create"
        model: "school_grade"
        save_as: "grade_ar1"
        values:
          name: "Grade Attendance Rate AR1"
          code: "EXTATTRATE-GR-AR1"
          type_id: "REC: grade_type_ar1.id"

      - step: "Setup - create grade class"
        action: "create"
        model: "school_grade_class"
        save_as: "grade_class_ar1"
        values:
          name: "Grade Class Attendance Rate AR1"
          code: "EXTATTRATE-GC-AR1"
          school_id: "REC: school_ar1.id"
          grade_id: "REC: grade_ar1.id"

      - step: "Setup - create student contact"
        action: "create"
        model: "res.partner"
        save_as: "contact_ar1"
        values:
          name: "Student Contact Attendance Rate AR1"

      - step: "Setup - create student"
        action: "create"
        model: "school_student"
        save_as: "student_ar1"
        values:
          name: "Student Attendance Rate AR1"
          code: "EXTATTRATE-ST-AR1"
          contact_id: "REC: contact_ar1.id"
          school_id: "REC: school_ar1.id"

      - step: "Setup - create enrollment"
        action: "create"
        model: "school_enrollment"
        save_as: "enrollment_ar1"
        values:
          academic_year_id: "REC: academic_year_ar1.id"
          academic_term_id: "REC: academic_term_ar1.id"
          school_id: "REC: school_ar1.id"
          grade_id: "REC: grade_ar1.id"
          grade_class_id: "REC: grade_class_ar1.id"
          student_id: "REC: student_ar1.id"

      - step: "Create the participant whose recap is under test"
        action: "create"
        model: "school_extracurricular_participant"
        save_as: "participant_ar1"
        values:
          offering_id: "REC: offering_ar1.id"
          student_id: "REC: student_ar1.id"
          enrollment_id: "REC: enrollment_ar1.id"
          billing_mode: "free"
          product_id: "REC: product_ar1.id"
          uom_quantity: 1.0
          price_unit: 0.0
          date_join: 2026-07-01

      - step: "Assert attendance rate is 0 before any session exists"
        action: "assert"
        target: "participant_ar1"
        asserts:
          session_done_count:
            type: "value"
            expected: 0
          attendance_present_count:
            type: "value"
            expected: 0
          attendance_rate:
            type: "value"
            expected: 0.0

      - step: "Setup - create session A (will be attended)"
        action: "create"
        model: "school_extracurricular_session"
        save_as: "session_ar1_a"
        values:
          offering_id: "REC: offering_ar1.id"
          teacher_id: "REC: teacher_ar1.id"
          date: 2026-08-04
          time_start: 14.0
          time_end: 15.5

      - step: "Add a Present attendance line for session A"
        action: "create"
        model: "school_extracurricular_session_attendance"
        save_as: "attendance_ar1_a"
        values:
          session_id: "REC: session_ar1_a.id"
          participant_id: "REC: participant_ar1.id"
          attendance_state: "present"

      - step: "Mark session A as Done"
        action: "call"
        target: "session_ar1_a"
        method: "action_done"
        asserts:
          state:
            type: "value"
            expected: "done"

      - step:
          "Assert attendance rate is still 0 with only one Planned-turned-Done session
          pending the second"
        action: "assert"
        target: "participant_ar1"
        asserts:
          session_done_count:
            type: "value"
            expected: 1
          attendance_present_count:
            type: "value"
            expected: 1
          attendance_rate:
            type: "value"
            expected: 100.0

      - step: "Setup - create session B (will be missed)"
        action: "create"
        model: "school_extracurricular_session"
        save_as: "session_ar1_b"
        values:
          offering_id: "REC: offering_ar1.id"
          teacher_id: "REC: teacher_ar1.id"
          date: 2026-08-11
          time_start: 14.0
          time_end: 15.5

      - step: "Add an Absent attendance line for session B"
        action: "create"
        model: "school_extracurricular_session_attendance"
        save_as: "attendance_ar1_b"
        values:
          session_id: "REC: session_ar1_b.id"
          participant_id: "REC: participant_ar1.id"
          attendance_state: "absent"

      - step: "Mark session B as Done"
        action: "call"
        target: "session_ar1_b"
        method: "action_done"
        asserts:
          state:
            type: "value"
            expected: "done"

      - step: "Assert one of two Done sessions was attended -- rate is 50"
        action: "assert"
        target: "participant_ar1"
        asserts:
          session_done_count:
            type: "value"
            expected: 2
          attendance_present_count:
            type: "value"
            expected: 1
          attendance_rate:
            type: "value"
            expected: 50.0
