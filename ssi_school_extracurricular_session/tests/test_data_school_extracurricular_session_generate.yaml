      - step: "Create generate wizard with only coach_partner_id, checking Tuesday"
        action: "create"
        model: "school_extracurricular_session_generate"
        save_as: "wizard_sg5"
        values:
          offering_id: "REC: offering_sg5.id"
          date_start: 2026-08-01
          date_end: 2026-08-14
          time_start: 14.0
          time_end: 15.5
          coach_partner_id: "REC: coach_partner_sg5.id"
          tue: true

      - step: "Run the generator"
        action: "call"
        target: "wizard_sg5"
        method: "action_generate"

      - step: "Search sessions generated for the offering"
        action: "search"
        model: "school_extracurricular_session"
        domain: [["offering_id", "=", "REC: offering_sg5.id"]]
        save_as: "generated_sg5"
        expect_count: 2

      - step: "Search the first generated session, ordered by date"
        action: "search"
        model: "school_extracurricular_session"
        domain: [["offering_id", "=", "REC: offering_sg5.id"]]
        order: "date asc"
        limit: 1
        save_as: "generated_sg5_first"
        expect_count: 1

      - step: "Search the second generated session, ordered by date"
        action: "search"
        model: "school_extracurricular_session"
        domain:
          [["offering_id", "=", "REC: offering_sg5.id"], ["date", "=", "2026-08-11"]]
        save_as: "generated_sg5_second"
        expect_count: 1

      - step: "Assert the first generated session has no teacher and the coach set"
        action: "assert"
        target: "generated_sg5_first"
        asserts:
          teacher_id:
            type: "value"
            operator: "is_falsy"
          coach_partner_id:
            type: "m2o"
            expected: "REC: coach_partner_sg5"

      - step: "Assert the second generated session has no teacher and the coach set"
        action: "assert"
        target: "generated_sg5_second"
        asserts:
          teacher_id:
            type: "value"
            operator: "is_falsy"
          coach_partner_id:
            type: "m2o"
            expected: "REC: coach_partner_sg5"

