options:
  auto_refresh: true

scenarios:
  - name: "Offering created without tracking switches keeps their defaults"
    steps:
      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type_si1"
        values:
          name: "Grade Type Session Instructor SI1"
          code: "EXTSESSINS-GT-SI1"

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school_si1"
        values:
          name: "School Session Instructor SI1"
          code: "EXTSESSINS-SCH-SI1"
          grade_type_id: "REC: grade_type_si1.id"

      - step: "Setup - create category"
        action: "create"
        model: "school_extracurricular_category"
        save_as: "category_si1"
        values:
          name: "Category Session Instructor SI1"
          code: "EXTSESSINS-CAT-SI1"

      - step: "Setup - create extracurricular"
        action: "create"
        model: "school_extracurricular"
        save_as: "extracurricular_si1"
        values:
          name: "Futsal Club Session Instructor SI1"
          code: "EXTSESSINS-EXT-SI1"
          category_id: "REC: category_si1.id"
          school_id: "REC: school_si1.id"

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year_si1"
        values:
          name: "AY Session Instructor SI1"
          code: "EXTSESSINS-AY-SI1"
          date_start: 2026-07-01
          date_end: 2027-06-30

      - step: "Setup - create academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term_si1"
        values:
          name: "Term Session Instructor SI1"
          code: "EXTSESSINS-TERM-SI1"
          date_start: 2026-07-01
          date_end: 2026-12-31
          year_id: "REC: academic_year_si1.id"

      - step: "Setup - create employee for teacher"
        action: "create"
        model: "hr.employee"
        save_as: "employee_si1"
        values:
          name: "Teacher Employee Session Instructor SI1"

      - step: "Setup - create teacher"
        action: "create"
        model: "school_teacher"
        save_as: "teacher_si1"
        values:
          name: "Teacher Session Instructor SI1"
          code: "EXTSESSINS-TCH-SI1"
          employee_id: "REC: employee_si1.id"

      - step: "Setup - create product"
        action: "create"
        model: "product.product"
        save_as: "product_si1"
        values:
          name: "Extracurricular Fee Session Instructor SI1"

      - step: "Create offering without setting either tracking switch"
        action: "create"
        model: "school_extracurricular_offering"
        save_as: "offering_si1"
        values:
          extracurricular_id: "REC: extracurricular_si1.id"
          academic_year_id: "REC: academic_year_si1.id"
          academic_term_id: "REC: academic_term_si1.id"
          teacher_id: "REC: teacher_si1.id"
          date_start: 2026-07-01
          date_end: 2026-12-31
          product_id: "REC: product_si1.id"
          price_unit: 150000.0

      - step: "Assert the tracking switches keep their defaults"
        action: "assert"
        target: "offering_si1"
        asserts:
          participant_attendance_tracked:
            type: "value"
            expected: true
          instructor_attendance_tracked:
            type: "value"
            expected: false

