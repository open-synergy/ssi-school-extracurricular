          offering_id: "REC: offering_si2.id"
          role: "assistant"
          partner_id: "REC: partner_assistant_si2.id"

      - step: "Create session via create, only setting the Offering"
        action: "create"
        model: "school_extracurricular_session"
        save_as: "session_si2"
        values:
          offering_id: "REC: offering_si2.id"
          teacher_id: "REC: teacher_si2.id"
          date: 2026-08-03
          time_start: 14.0
          time_end: 15.5

      - step: "Assert the session's Instructor roster has two lines"
        action: "assert"
        target: "session_si2"
        asserts:
          instructor_ids:
            type: "o2m"
            check: "count"
            expected_count: 2

      - step: "Find the copied head instructor line"
        action: "search"
        model: "school_extracurricular_session_instructor"
        domain:
          - ["session_id", "=", "REC: session_si2.id"]
          - ["role", "=", "head"]
        save_as: "copied_head_si2"
        limit: 1
        expect_count: 1

      - step: "Assert the copied head instructor line matches the template"
        action: "assert"
        target: "copied_head_si2"
        asserts:
          teacher_id:
            type: "m2o"
            expected: "REC: teacher_head_si2"
          attendance_state:
            type: "value"
            operator: "is_falsy"

      - step: "Find the copied assistant instructor line"
        action: "search"
        model: "school_extracurricular_session_instructor"
