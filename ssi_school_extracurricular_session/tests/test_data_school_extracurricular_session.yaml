      - step: "Cancel session via wizard with reason"
        action: "wizard"
        model: "cancel_extracurricular_session"
        target: "session_s3"
        context:
          default_session_id: "REC: session_s3.id"
        values:
          cancel_reason: "Weather cancelled the match"
        method: "action_confirm"
        asserts:
          state:
            type: "value"
            expected: "cancelled"
          cancel_reason:
            type: "value"
            expected: "Weather cancelled the match"

      - step: "Restart the cancelled session"
        action: "call"
        target: "session_s3"
        method: "action_restart"
        asserts:
          state:
            type: "value"
            expected: "planned"
          cancel_reason:
            type: "value"
            operator: "is_falsy"

