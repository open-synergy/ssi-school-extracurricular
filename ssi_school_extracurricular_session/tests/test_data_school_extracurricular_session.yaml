options:
  auto_refresh: true

scenarios:
  - name: "Create session from offering populates related fields and default teacher"
    steps:
      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type_s1"
        values:
          name: "Grade Type Session S1"
          code: "EXTSESS-GT-S1"

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school_s1"
        values:
          name: "School Session S1"
          code: "EXTSESS-SCH-S1"
          grade_type_id: "REC: grade_type_s1.id"

      - step: "Setup - create category"
        action: "create"
        model: "school_extracurricular_category"
        save_as: "category_s1"
        values:
          name: "Category Session S1"
          code: "EXTSESS-CAT-S1"

      - step: "Setup - create extracurricular"
        action: "create"
        model: "school_extracurricular"
        save_as: "extracurricular_s1"
        values:
          name: "Futsal Club Session S1"
          code: "EXTSESS-EXT-S1"
          category_id: "REC: category_s1.id"
          school_id: "REC: school_s1.id"

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year_s1"
        values:
          name: "AY Session S1"
          code: "EXTSESS-AY-S1"
          date_start: 2026-07-01
          date_end: 2027-06-30

      - step: "Setup - create academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term_s1"
        values:
          name: "Term Session S1"
          code: "EXTSESS-TERM-S1"
          date_start: 2026-07-01
          date_end: 2026-12-31
          year_id: "REC: academic_year_s1.id"

      - step: "Setup - create employee for teacher"
        action: "create"
        model: "hr.employee"
        save_as: "employee_s1"
        values:
          name: "Teacher Employee Session S1"

      - step: "Setup - create teacher"
        action: "create"
        model: "school_teacher"
        save_as: "teacher_s1"
        values:
          name: "Teacher Session S1"
          code: "EXTSESS-TCH-S1"
          employee_id: "REC: employee_s1.id"

      - step: "Setup - create product"
        action: "create"
        model: "product.product"
        save_as: "product_s1"
        values:
          name: "Extracurricular Fee Session S1"

      - step: "Setup - create offering"
        action: "create"
        model: "school_extracurricular_offering"
        save_as: "offering_s1"
        values:
          extracurricular_id: "REC: extracurricular_s1.id"
          academic_year_id: "REC: academic_year_s1.id"
          academic_term_id: "REC: academic_term_s1.id"
          teacher_id: "REC: teacher_s1.id"
          date_start: 2026-07-01
          date_end: 2026-12-31
          product_id: "REC: product_s1.id"
          price_unit: 150000.0

      - step: "Create session via form, only setting the Offering"
        action: "form"
        model: "school_extracurricular_session"
        save_as: "session_s1"
        values:
          offering_id: "REC: offering_s1"
          date: 2026-08-03
          time_start: 14.0
          time_end: 15.5
        asserts:
          teacher_id:
            type: "m2o"
            expected: "REC: teacher_s1"
          extracurricular_id:
            type: "m2o"
            expected: "REC: extracurricular_s1"
          school_id:
            type: "m2o"
            expected: "REC: school_s1"
          academic_term_id:
            type: "m2o"
            expected: "REC: academic_term_s1"
        save: true

      - step: "Assert session created in planned state"
        action: "assert"
        target: "session_s1"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          state:
            type: "value"
            expected: "planned"

