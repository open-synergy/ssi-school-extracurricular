options:
  auto_refresh: true

scenarios:
  - name: "Extracurricular Participant defaults, amount, and full workflow"
    steps:
      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type_wf"
        values:
          name: "Grade Type Participant WF"
          code: "EXTPAR-GT-WF"

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school_wf"
        values:
          name: "School Participant WF"
          code: "EXTPAR-SCH-WF"
          grade_type_id: "REC: grade_type_wf.id"

      - step: "Setup - create category"
        action: "create"
        model: "school_extracurricular_category"
        save_as: "category_wf"
        values:
          name: "Category Participant WF"
          code: "EXTPAR-CAT-WF"

      - step: "Setup - create extracurricular"
        action: "create"
        model: "school_extracurricular"
        save_as: "extracurricular_wf"
        values:
          name: "Futsal Club Participant WF"
          code: "EXTPAR-EXT-WF"
          category_id: "REC: category_wf.id"
          school_id: "REC: school_wf.id"

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year_wf"
        values:
          name: "AY Participant WF"
          code: "EXTPAR-AY-WF"
          date_start: 2026-07-01
          date_end: 2027-06-30

      - step: "Setup - create academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term_wf"
        values:
          name: "Term Participant WF"
          code: "EXTPAR-TERM-WF"
          date_start: 2026-07-01
          date_end: 2026-12-31
          year_id: "REC: academic_year_wf.id"

      - step: "Setup - create employee for teacher"
        action: "create"
        model: "hr.employee"
        save_as: "employee_wf"
        values:
          name: "Teacher Employee Participant WF"

      - step: "Setup - create teacher"
        action: "create"
        model: "school_teacher"
        save_as: "teacher_wf"
        values:
          name: "Teacher Participant WF"
          code: "EXTPAR-TCH-WF"
          employee_id: "REC: employee_wf.id"

      - step: "Setup - create offering product"
        action: "create"
        model: "product.product"
        save_as: "product_wf"
        values:
          name: "Extracurricular Fee Participant WF"

      - step: "Setup - create offering"
        action: "create"
        model: "school_extracurricular_offering"
        save_as: "offering_wf"
        values:
          extracurricular_id: "REC: extracurricular_wf.id"
          academic_year_id: "REC: academic_year_wf.id"
          academic_term_id: "REC: academic_term_wf.id"
          teacher_id: "REC: teacher_wf.id"
          date_start: 2026-07-01
          date_end: 2026-12-31
          product_id: "REC: product_wf.id"
          price_unit: 150000.0

      - step: "Setup - create grade"
        action: "create"
        model: "school_grade"
        save_as: "grade_wf"
        values:
          name: "Grade Participant WF"
          code: "EXTPAR-GR-WF"
          type_id: "REC: grade_type_wf.id"

      - step: "Setup - create grade class"
        action: "create"
        model: "school_grade_class"
        save_as: "grade_class_wf"
        values:
          name: "Grade Class Participant WF"
          code: "EXTPAR-GC-WF"
          school_id: "REC: school_wf.id"
          grade_id: "REC: grade_wf.id"

      - step: "Setup - create student contact"
        action: "create"
        model: "res.partner"
        save_as: "contact_wf"
        values:
          name: "Student Contact Participant WF"

      - step: "Setup - create student"
        action: "create"
        model: "school_student"
        save_as: "student_wf"
        values:
          name: "Student Participant WF"
          code: "EXTPAR-ST-WF"
          contact_id: "REC: contact_wf.id"
          school_id: "REC: school_wf.id"

      - step: "Setup - create enrollment"
        action: "create"
        model: "school_enrollment"
        save_as: "enrollment_wf"
        values:
          academic_year_id: "REC: academic_year_wf.id"
          academic_term_id: "REC: academic_term_wf.id"
          school_id: "REC: school_wf.id"
          grade_id: "REC: grade_wf.id"
          grade_class_id: "REC: grade_class_wf.id"
          student_id: "REC: student_wf.id"

      - step: "Create participant"
        action: "create"
        model: "school_extracurricular_participant"
        save_as: "participant_wf"
        values:
          offering_id: "REC: offering_wf.id"
          student_id: "REC: student_wf.id"
          enrollment_id: "REC: enrollment_wf.id"
          billing_mode: "enrollment"
          product_id: "REC: product_wf.id"
          uom_quantity: 1.0
          price_unit: 600000.0

      - step: "Assert participant created in draft"
        action: "assert"
        target: "participant_wf"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          state:
            type: "value"
            expected: "draft"

      - step: "Assert school_id populated from offering"
        action: "assert"
        target: "participant_wf"
        asserts:
          school_id:
            type: "m2o"
            expected: "REC: school_wf"

      - step: "Assert academic_term_id populated from offering"
        action: "assert"
        target: "participant_wf"
        asserts:
          academic_term_id:
            type: "m2o"
            expected: "REC: academic_term_wf"

      - step: "Assert currency_id populated from offering"
        action: "assert"
        target: "participant_wf"
        asserts:
          currency_id:
            type: "m2o"
            expected: "REC: offering_wf.currency_id"

      - step: "Assert amount computed without tax"
        action: "assert"
        target: "participant_wf"
        asserts:
          amount_untaxed:
            type: "value"
            expected: 600000.0
          amount_tax:
            type: "value"
            expected: 0.0
          amount_total:
            type: "value"
            expected: 600000.0

      - step: "Setup - get revenue account type"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "revenue_type_wf"

      - step: "Setup - create income account"
        action: "create"
        model: "account.account"
        save_as: "income_account_wf"
        values:
          name: "Extracurricular Income WF"
          code: "EXTPAR-INC-WF"
          user_type_id: "REC: revenue_type_wf.id"

      - step: "Setup - create payment term to allocate the fee to"
        action: "create"
        model: "school_enrollment_payment_term"
        save_as: "term_wf"
        values:
          enrollment_id: "REC: enrollment_wf.id"
          name: "Term Participant WF"

      - step: "Allocate the participant's fee to the payment term"
        action: "create"
        model: "school_extracurricular_participant_allocation"
        save_as: "allocation_wf"
        values:
          participant_id: "REC: participant_wf.id"
          payment_term_id: "REC: term_wf.id"
          product_id: "REC: product_wf.id"
          name: "Extracurricular Fee Participant WF"
          account_id: "REC: income_account_wf.id"
          uom_quantity: 1.0
          price_unit: 600000.0

      - step: "Confirm participant"
        action: "call"
        target: "participant_wf"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve participant"
        action: "call"
        target: "participant_wf"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Assert the addendum line was created on the payment term"
        action: "assert"
        target: "term_wf"
        asserts:
          extra_detail_ids:
            type: "o2m"
            check: "count"
            expected_count: 1
          amount_extra:
            type: "value"
            expected: 600000.0

      - step: "Assert document number generated"
        action: "assert"
        target: "participant_wf"
        asserts:
          name:
            type: "value"
            operator: "not_equals"
            expected: "/"

      - step: "Assert offering participant_count reflects the open participant"
        action: "assert"
        target: "offering_wf"
        asserts:
          participant_count:
            type: "value"
            expected: 1

