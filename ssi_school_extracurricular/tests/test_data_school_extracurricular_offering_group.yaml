options:
  auto_refresh: true

scenarios:
  - name: "Extracurricular Offering Group - two groups each fill their own quota"
    steps:
      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type_gq"
        values:
          name: "Grade Type Group GQ"
          code: "EXTGRP-GT-GQ"

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school_gq"
        values:
          name: "School Group GQ"
          code: "EXTGRP-SCH-GQ"
          grade_type_id: "REC: grade_type_gq.id"

      - step: "Setup - create category"
        action: "create"
        model: "school_extracurricular_category"
        save_as: "category_gq"
        values:
          name: "Category Group GQ"
          code: "EXTGRP-CAT-GQ"

      - step: "Setup - create extracurricular"
        action: "create"
        model: "school_extracurricular"
        save_as: "extracurricular_gq"
        values:
          name: "Futsal Club Group GQ"
          code: "EXTGRP-EXT-GQ"
          category_id: "REC: category_gq.id"
          school_id: "REC: school_gq.id"

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year_gq"
        values:
          name: "AY Group GQ"
          code: "EXTGRP-AY-GQ"
          date_start: 2026-07-01
          date_end: 2027-06-30

      - step: "Setup - create academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term_gq"
        values:
          name: "Term Group GQ"
          code: "EXTGRP-TERM-GQ"
          date_start: 2026-07-01
          date_end: 2026-12-31
          year_id: "REC: academic_year_gq.id"

      - step: "Setup - create employee for teacher"
        action: "create"
        model: "hr.employee"
        save_as: "employee_gq"
        values:
          name: "Teacher Employee Group GQ"

      - step: "Setup - create teacher"
        action: "create"
        model: "school_teacher"
        save_as: "teacher_gq"
        values:
          name: "Teacher Group GQ"
          code: "EXTGRP-TCH-GQ"
          employee_id: "REC: employee_gq.id"

      - step: "Setup - create offering product"
        action: "create"
        model: "product.product"
        save_as: "product_gq"
        values:
          name: "Extracurricular Fee Group GQ"

      - step: "Setup - create offering with no offering-level quota limit"
        action: "create"
        model: "school_extracurricular_offering"
        save_as: "offering_gq"
        values:
          extracurricular_id: "REC: extracurricular_gq.id"
          academic_year_id: "REC: academic_year_gq.id"
          academic_term_id: "REC: academic_term_gq.id"
          teacher_id: "REC: teacher_gq.id"
          date_start: 2026-07-01
          date_end: 2026-12-31
          product_id: "REC: product_gq.id"
          price_unit: 150000.0

      - step: "Create Group A with quota_max 1"
        action: "create"
        model: "school_extracurricular_offering_group"
        save_as: "group_gq_a"
        values:
          offering_id: "REC: offering_gq.id"
          name: "Group GQ A"
          quota_max: 1

      - step: "Create Group B with quota_max 1"
        action: "create"
        model: "school_extracurricular_offering_group"
        save_as: "group_gq_b"
        values:
          offering_id: "REC: offering_gq.id"
          name: "Group GQ B"
          quota_max: 1

      - step: "Setup - create grade"
        action: "create"
        model: "school_grade"
        save_as: "grade_gq"
        values:
          name: "Grade Group GQ"
          code: "EXTGRP-GR-GQ"
          type_id: "REC: grade_type_gq.id"

      - step: "Setup - create grade class"
        action: "create"
        model: "school_grade_class"
        save_as: "grade_class_gq"
        values:
          name: "Grade Class Group GQ"
          code: "EXTGRP-GC-GQ"
          school_id: "REC: school_gq.id"
          grade_id: "REC: grade_gq.id"

      - step: "Setup - create contact of first student"
        action: "create"
        model: "res.partner"
        save_as: "contact_gq_a"
        values:
          name: "Student Contact Group GQ A"

      - step: "Setup - create first student"
        action: "create"
        model: "school_student"
        save_as: "student_gq_a"
        values:
          name: "Student Group GQ A"
          code: "EXTGRP-ST-GQ-A"
          contact_id: "REC: contact_gq_a.id"
          school_id: "REC: school_gq.id"

      - step: "Setup - create enrollment for first student"
        action: "create"
        model: "school_enrollment"
        save_as: "enrollment_gq_a"
        values:
          academic_year_id: "REC: academic_year_gq.id"
          academic_term_id: "REC: academic_term_gq.id"
          school_id: "REC: school_gq.id"
          grade_id: "REC: grade_gq.id"
          grade_class_id: "REC: grade_class_gq.id"
          student_id: "REC: student_gq_a.id"

      - step: "Setup - create contact of second student"
        action: "create"
        model: "res.partner"
        save_as: "contact_gq_b"
        values:
          name: "Student Contact Group GQ B"

      - step: "Setup - create second student"
        action: "create"
        model: "school_student"
        save_as: "student_gq_b"
        values:
          name: "Student Group GQ B"
          code: "EXTGRP-ST-GQ-B"
          contact_id: "REC: contact_gq_b.id"
          school_id: "REC: school_gq.id"

      - step: "Setup - create enrollment for second student"
        action: "create"
        model: "school_enrollment"
        save_as: "enrollment_gq_b"
        values:
          academic_year_id: "REC: academic_year_gq.id"
          academic_term_id: "REC: academic_term_gq.id"
          school_id: "REC: school_gq.id"
          grade_id: "REC: grade_gq.id"
          grade_class_id: "REC: grade_class_gq.id"
          student_id: "REC: student_gq_b.id"

      - step: "Create participant A placed in Group A"
        action: "create"
        model: "school_extracurricular_participant"
        save_as: "participant_gq_a"
        values:
          offering_id: "REC: offering_gq.id"
          group_id: "REC: group_gq_a.id"
          student_id: "REC: student_gq_a.id"
          enrollment_id: "REC: enrollment_gq_a.id"
          billing_mode: "free"
          product_id: "REC: product_gq.id"
          price_unit: 150000.0

      - step: "Create participant B placed in Group B"
        action: "create"
        model: "school_extracurricular_participant"
        save_as: "participant_gq_b"
        values:
          offering_id: "REC: offering_gq.id"
          group_id: "REC: group_gq_b.id"
          student_id: "REC: student_gq_b.id"
          enrollment_id: "REC: enrollment_gq_b.id"
          billing_mode: "free"
          product_id: "REC: product_gq.id"
          price_unit: 150000.0

      - step: "Confirm participant A"
        action: "call"
        target: "participant_gq_a"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve participant A - Group A quota now full"
        action: "call"
        target: "participant_gq_a"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Confirm participant B"
        action: "call"
        target: "participant_gq_b"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve participant B - Group B has its own separate quota"
        action: "call"
        target: "participant_gq_b"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Assert Group A participant_count reflects its own open participant"
        action: "assert"
        target: "group_gq_a"
        asserts:
          participant_count:
            type: "value"
            expected: 1

      - step: "Assert Group B participant_count reflects its own open participant"
        action: "assert"
        target: "group_gq_b"
        asserts:
          participant_count:
            type: "value"
            expected: 1

