          code: "EXTOFF-EXT-DT"
          category_id: "REC: category_date.id"
          school_id: "REC: school_date.id"

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year_date"
        values:
          name: "AY Offering Date"
          code: "EXTOFF-AY-DT"
          date_start: 2026-07-01
          date_end: 2027-06-30

      - step: "Setup - create academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term_date"
        values:
          name: "Term Offering Date"
          code: "EXTOFF-TERM-DT"
          date_start: 2026-07-01
          date_end: 2026-12-31
          year_id: "REC: academic_year_date.id"

      - step: "Setup - create employee for teacher"
        action: "create"
        model: "hr.employee"
        save_as: "employee_date"
        values:
          name: "Teacher Employee Offering Date"

      - step: "Setup - create teacher"
        action: "create"
        model: "school_teacher"
        save_as: "teacher_date"
        values:
          name: "Teacher Offering Date"
          code: "EXTOFF-TCH-DT"
          employee_id: "REC: employee_date.id"

      - step: "Setup - create product"
        action: "create"
        model: "product.product"
        save_as: "product_date"
        values:
