options:
  auto_refresh: true

scenarios:
  - name: "Extracurricular Offering full workflow and defaults"
    steps:
      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type_wf"
        values:
          name: "Grade Type Offering WF"
          code: "EXTOFF-GT-WF"

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school_wf"
        values:
          name: "School Offering WF"
          code: "EXTOFF-SCH-WF"
          grade_type_id: "REC: grade_type_wf.id"

      - step: "Setup - create category"
        action: "create"
        model: "school_extracurricular_category"
        save_as: "category_wf"
        values:
          name: "Category Offering WF"
          code: "EXTOFF-CAT-WF"

      - step: "Setup - create extracurricular"
        action: "create"
        model: "school_extracurricular"
        save_as: "extracurricular_wf"
        values:
          name: "Futsal Club WF"
          code: "EXTOFF-EXT-WF"
          category_id: "REC: category_wf.id"
          school_id: "REC: school_wf.id"

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year_wf"
        values:
          name: "AY Offering WF"
          code: "EXTOFF-AY-WF"
          date_start: 2026-07-01
          date_end: 2027-06-30

      - step: "Setup - create academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term_wf"
        values:
          name: "Term Offering WF"
          code: "EXTOFF-TERM-WF"
          date_start: 2026-07-01
          date_end: 2026-12-31
          year_id: "REC: academic_year_wf.id"

      - step: "Setup - create employee for teacher"
        action: "create"
        model: "hr.employee"
        save_as: "employee_wf"
        values:
          name: "Teacher Employee Offering WF"

      - step: "Setup - create teacher"
        action: "create"
        model: "school_teacher"
        save_as: "teacher_wf"
        values:
          name: "Teacher Offering WF"
          code: "EXTOFF-TCH-WF"
          employee_id: "REC: employee_wf.id"

      - step: "Setup - create product"
        action: "create"
        model: "product.product"
        save_as: "product_wf"
        values:
          name: "Extracurricular Fee Offering WF"

      - step: "Create extracurricular offering"
        action: "create"
        model: "school_extracurricular_offering"
        save_as: "offering_wf"
        values:
          extracurricular_id: "REC: extracurricular_wf.id"
          academic_year_id: "REC: academic_year_wf.id"
          academic_term_id: "REC: academic_term_wf.id"
          teacher_id: "REC: teacher_wf.id"
          date_start: 2026-07-01
          date_end: 2026-12-31
          product_id: "REC: product_wf.id"
          price_unit: 150000.0

      - step: "Assert offering created in draft with defaults"
        action: "assert"
        target: "offering_wf"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          state:
            type: "value"
            expected: "draft"
          billing_mode:
            type: "value"
            expected: "enrollment"
          billing_frequency:
            type: "value"
            expected: "one_time"

      - step: "Assert school_id populated from extracurricular"
        action: "assert"
        target: "offering_wf"
        asserts:
          school_id:
            type: "m2o"
            expected: "REC: school_wf"

      - step: "Assert category_id populated from extracurricular"
        action: "assert"
        target: "offering_wf"
        asserts:
          category_id:
            type: "m2o"
            expected: "REC: category_wf"

      - step: "Confirm offering"
        action: "call"
        target: "offering_wf"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve offering"
        action: "call"
        target: "offering_wf"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Assert document number generated"
        action: "assert"
        target: "offering_wf"
        asserts:
          name:
            type: "value"
            operator: "not_equals"
            expected: "/"

      - step: "Done offering"
        action: "call"
        target: "offering_wf"
        method: "action_done"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "done"

  - name: "Extracurricular Offering rejects end date before start date"
