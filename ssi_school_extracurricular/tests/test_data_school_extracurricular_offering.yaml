          date_end: 2026-12-31
          product_id: "REC: product_term.id"
          price_unit: 150000.0

  - name: "Extracurricular Offering rejects maximum quota below minimum"
    steps:
      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type_quota"
        values:
          name: "Grade Type Offering Quota"
          code: "EXTOFF-GT-QT"

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school_quota"
        values:
          name: "School Offering Quota"
          code: "EXTOFF-SCH-QT"
          grade_type_id: "REC: grade_type_quota.id"

      - step: "Setup - create category"
        action: "create"
        model: "school_extracurricular_category"
        save_as: "category_quota"
        values:
          name: "Category Offering Quota"
          code: "EXTOFF-CAT-QT"

      - step: "Setup - create extracurricular"
        action: "create"
