      - step: "Setup - create product"
        action: "create"
        model: "product.product"
        save_as: "product_notch"
        values:
          name: "Extracurricular Fee Offering No Teacher"

      - step: "Create offering without teacher_id must fail"
        action: "form"
        model: "school_extracurricular_offering"
        expect_error:
          type: "AssertionError"
          message_contains: "is a required field"
        values:
          extracurricular_id: "REC: extracurricular_notch"
          academic_year_id: "REC: academic_year_notch"
          academic_term_id: "REC: academic_term_notch"
