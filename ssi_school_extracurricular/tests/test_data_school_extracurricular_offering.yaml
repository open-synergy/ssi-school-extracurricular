        values:
          extracurricular_id: "REC: extracurricular_onc"
          academic_year_id: "REC: academic_year_onc"
          academic_term_id: "REC: academic_term_onc"
          date_start: 2026-07-01
          date_end: 2026-12-31
          price_unit: 150000.0
        asserts:
          coach_partner_id:
            type: "m2o"
            expected: "REC: coach_partner_onc"
          teacher_id:
            type: "value"
            operator: "is_falsy"
        save: false

  - name: "Extracurricular Offering restart approval process grant"
    steps:
      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type_ra"
        values:
          name: "Grade Type Offering RA"
          code: "EXTOFF-GT-RA"

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school_ra"
        values:
          name: "School Offering RA"
          code: "EXTOFF-SCH-RA"
          grade_type_id: "REC: grade_type_ra.id"

      - step: "Setup - create category"
        action: "create"
        model: "school_extracurricular_category"
        save_as: "category_ra"
        values:
          name: "Category Offering RA"
          code: "EXTOFF-CAT-RA"

      - step: "Setup - create product"
        action: "create"
        model: "product.product"
        save_as: "product_ra"
        values:
          name: "Extracurricular Fee Offering RA"

      - step: "Setup - create extracurricular"
        action: "create"
        model: "school_extracurricular"
        save_as: "extracurricular_ra"
        values:
          name: "Futsal Club RA"
          code: "EXTOFF-EXT-RA"
          category_id: "REC: category_ra.id"
          school_id: "REC: school_ra.id"
          product_id: "REC: product_ra.id"

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year_ra"
        values:
          name: "AY Offering RA"
          code: "EXTOFF-AY-RA"
          date_start: 2026-07-01
          date_end: 2027-06-30

      - step: "Setup - create academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term_ra"
        values:
          name: "Term Offering RA"
          code: "EXTOFF-TERM-RA"
          date_start: 2026-07-01
          date_end: 2026-12-31
          year_id: "REC: academic_year_ra.id"

      - step: "Setup - create employee for teacher"
        action: "create"
        model: "hr.employee"
        save_as: "employee_ra"
        values:
          name: "Teacher Employee Offering RA"

      - step: "Setup - create teacher"
        action: "create"
        model: "school_teacher"
        save_as: "teacher_ra"
        values:
          name: "Teacher Offering RA"
          code: "EXTOFF-TCH-RA"
          employee_id: "REC: employee_ra.id"

      - step: "Create offering"
        action: "create"
        model: "school_extracurricular_offering"
        save_as: "offering_ra"
        values:
          extracurricular_id: "REC: extracurricular_ra.id"
          academic_year_id: "REC: academic_year_ra.id"
          academic_term_id: "REC: academic_term_ra.id"
          teacher_id: "REC: teacher_ra.id"
          date_start: 2026-07-01
          date_end: 2026-12-31
          product_id: "REC: product_ra.id"
          price_unit: 150000.0

      - step: "Create a user who is only an Offering User (not Officer)"
        action: "create"
        model: "res.users"
        save_as: "offering_plain_user"
        values:
          name: "Offering Plain User RA"
          login: "offering_plain_user_ra@example.com"
          groups_id:
            - - 6
              - 0
              - - "REF:
                  ssi_school_extracurricular.school_extracurricular_offering_user_group"

      - step: "Create a user who is an Offering Officer"
        action: "create"
        model: "res.users"
        save_as: "offering_officer_user"
        values:
          name: "Offering Officer User RA"
          login: "offering_officer_user_ra@example.com"
          groups_id:
            - - 6
              - 0
              - - "REF:
                  ssi_school_extracurricular.school_extracurricular_offering_officer_group"

      - step:
          "Negative (c) - draft record grants no restart approval, even to an Officer"
        action: "assert"
        target: "offering_ra"
        as_user: "offering_officer_user"
        asserts:
          restart_approval_ok:
            type: "value"
            expected: false

      # `approval_template_school_extracurricular_offering` (see
      # approval_template/school_extracurricular_offering.xml) matches every
      # offering, so it is deactivated for the duration of this one
      # `action_confirm` call to keep `approval_template_id` empty -- the
      # stalled-without-a-template scenario `restart_approval_ok` exists to
      # recover from -- then reactivated immediately afterwards.
      - step: "Get the module's approval.template for offering"
        action: "ref"
        xml_id: "ssi_school_extracurricular.approval_template_school_extracurricular_offering"
        save_as: "approval_template_ra"

      - step: "Deactivate the approval template"
        action: "write"
        target: "approval_template_ra"
        values:
          active: false

      - step: "Confirm offering while no approval template matches"
        action: "call"
        target: "offering_ra"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"
          approval_template_id:
            type: "value"
            operator: "is_falsy"

      - step: "Reactivate the approval template"
        action: "write"
        target: "approval_template_ra"
        values:
          active: true

      - step:
          "Positive - confirmed record with no template grants restart approval to an
          Officer"
        action: "assert"
        target: "offering_ra"
        as_user: "offering_officer_user"
        asserts:
          restart_approval_ok:
            type: "value"
            expected: true

      - step: "Negative (a) - the same record grants nothing to a plain User"
        action: "assert"
        target: "offering_ra"
        as_user: "offering_plain_user"
        asserts:
          restart_approval_ok:
            type: "value"
            expected: false

      # admin is an Officer (via the Manager group's implied_ids and its
      # explicit `users=` listing in
      # security/res_groups/school_extracurricular_offering.xml), so it may
      # click Restart Approval Process itself once a template is available
      # again. The assert below is not decorative: it forces a `_refresh()`
      # of the previous step's `as_user: offering_plain_user` cache before
      # admin calls the method, since `restart_approval_ok` is a
      # non-`depends_context` policy field and `_refresh()` only runs inside
      # `_run_asserts`/`_action_search` -- never before a plain `call`.
      - step: "Admin (Officer via the Manager group) is also granted restart approval"
        action: "assert"
        target: "offering_ra"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          restart_approval_ok:
            type: "value"
            expected: true

      - step: "Restart the approval process now that a template matches again"
        action: "call"
        target: "offering_ra"
        method: "action_reload_approval_template"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"
          approval_template_id:
            type: "value"
            operator: "is_truthy"

      - step:
          "Negative (b) - once approval_template_id is filled, restart approval is
          denied again"
        action: "assert"
        target: "offering_ra"
        as_user: "offering_officer_user"
        asserts:
          restart_approval_ok:
            type: "value"
            expected: false
