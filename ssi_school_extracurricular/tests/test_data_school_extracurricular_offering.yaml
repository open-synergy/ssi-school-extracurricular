          name: "Futsal Club Quota"
          code: "EXTOFF-EXT-QT"
          category_id: "REC: category_quota.id"
          school_id: "REC: school_quota.id"

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year_quota"
        values:
          name: "AY Offering Quota"
          code: "EXTOFF-AY-QT"
          date_start: 2026-07-01
          date_end: 2027-06-30

      - step: "Setup - create academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term_quota"
        values:
          name: "Term Offering Quota"
          code: "EXTOFF-TERM-QT"
          date_start: 2026-07-01
          date_end: 2026-12-31
          year_id: "REC: academic_year_quota.id"

      - step: "Setup - create employee for teacher"
        action: "create"
        model: "hr.employee"
        save_as: "employee_quota"
        values:
          name: "Teacher Employee Offering Quota"

      - step: "Setup - create teacher"
        action: "create"
