      - step: "Setup - create academic term under year A"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term_term_a"
        values:
          name: "Term Offering Term A"
          code: "EXTOFF-TERM-TM-A"
          date_start: 2026-07-01
          date_end: 2026-12-31
