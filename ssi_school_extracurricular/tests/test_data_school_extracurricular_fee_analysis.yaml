options:
  auto_refresh: true

scenarios:
  - name: "Route A allocation appears as an enrollment-billed analysis row"
    steps:
      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type_ra"
        values:
          name: "Grade Type Fee Analysis RA"
          code: "EXTFA-GT-RA"

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school_ra"
        values:
          name: "School Fee Analysis RA"
          code: "EXTFA-SCH-RA"
          grade_type_id: "REC: grade_type_ra.id"

      - step: "Setup - create category"
        action: "create"
        model: "school_extracurricular_category"
        save_as: "category_ra"
        values:
          name: "Category Fee Analysis RA"
          code: "EXTFA-CAT-RA"

      - step: "Setup - create extracurricular"
        action: "create"
        model: "school_extracurricular"
        save_as: "extracurricular_ra"
        values:
          name: "Chess Club Fee Analysis RA"
          code: "EXTFA-EXT-RA"
          category_id: "REC: category_ra.id"
          school_id: "REC: school_ra.id"

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year_ra"
        values:
          name: "AY Fee Analysis RA"
          code: "EXTFA-AY-RA"
          date_start: 2026-07-01
          date_end: 2027-06-30

      - step: "Setup - create academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term_ra"
        values:
          name: "Term Fee Analysis RA"
          code: "EXTFA-TERM-RA"
          date_start: 2026-07-01
          date_end: 2026-12-31
          year_id: "REC: academic_year_ra.id"

      - step: "Setup - create employee for teacher"
        action: "create"
        model: "hr.employee"
        save_as: "employee_ra"
        values:
          name: "Teacher Employee Fee Analysis RA"

      - step: "Setup - create teacher"
        action: "create"
        model: "school_teacher"
        save_as: "teacher_ra"
        values:
          name: "Teacher Fee Analysis RA"
          code: "EXTFA-TCH-RA"
          employee_id: "REC: employee_ra.id"

      - step: "Setup - create offering product"
        action: "create"
        model: "product.product"
        save_as: "product_ra"
        values:
          name: "Extracurricular Fee Fee Analysis RA"

      - step: "Setup - create offering"
        action: "create"
        model: "school_extracurricular_offering"
        save_as: "offering_ra"
        values:
          extracurricular_id: "REC: extracurricular_ra.id"
          academic_year_id: "REC: academic_year_ra.id"
          academic_term_id: "REC: academic_term_ra.id"
          teacher_id: "REC: teacher_ra.id"
          date_start: 2026-07-01
          date_end: 2026-12-31
          product_id: "REC: product_ra.id"
          price_unit: 400000.0

      - step: "Setup - create grade"
        action: "create"
        model: "school_grade"
        save_as: "grade_ra"
        values:
          name: "Grade Fee Analysis RA"
          code: "EXTFA-GR-RA"
          type_id: "REC: grade_type_ra.id"

      - step: "Setup - create grade class"
        action: "create"
        model: "school_grade_class"
        save_as: "grade_class_ra"
        values:
          name: "Grade Class Fee Analysis RA"
          code: "EXTFA-GC-RA"
          school_id: "REC: school_ra.id"
          grade_id: "REC: grade_ra.id"

      - step: "Setup - create student contact"
        action: "create"
        model: "res.partner"
        save_as: "contact_ra"
        values:
          name: "Student Contact Fee Analysis RA"

      - step: "Setup - create student"
        action: "create"
        model: "school_student"
        save_as: "student_ra"
        values:
          name: "Student Fee Analysis RA"
          code: "EXTFA-ST-RA"
          contact_id: "REC: contact_ra.id"
          school_id: "REC: school_ra.id"

      - step: "Setup - create enrollment"
        action: "create"
        model: "school_enrollment"
        save_as: "enrollment_ra"
        values:
          academic_year_id: "REC: academic_year_ra.id"
          academic_term_id: "REC: academic_term_ra.id"
          school_id: "REC: school_ra.id"
          grade_id: "REC: grade_ra.id"
          grade_class_id: "REC: grade_class_ra.id"
          student_id: "REC: student_ra.id"

      - step: "Create participant"
        action: "create"
        model: "school_extracurricular_participant"
        save_as: "participant_ra"
        values:
          offering_id: "REC: offering_ra.id"
          student_id: "REC: student_ra.id"
          enrollment_id: "REC: enrollment_ra.id"
          billing_mode: "enrollment"
          product_id: "REC: product_ra.id"
          uom_quantity: 1.0
          price_unit: 400000.0

      - step: "Setup - get revenue account type"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "revenue_type_ra"

      - step: "Setup - create income account"
        action: "create"
        model: "account.account"
        save_as: "income_account_ra"
        values:
          name: "Extracurricular Income Fee Analysis RA"
          code: "EXTFA-INC-RA"
          user_type_id: "REC: revenue_type_ra.id"

      - step: "Setup - create payment term to allocate the fee to"
        action: "create"
        model: "school_enrollment_payment_term"
        save_as: "term_ra"
        values:
          enrollment_id: "REC: enrollment_ra.id"
          name: "Term Fee Analysis RA"

      - step: "Allocate the participant's fee to the payment term"
        action: "create"
        model: "school_extracurricular_participant_allocation"
        save_as: "allocation_ra"
        values:
          participant_id: "REC: participant_ra.id"
          payment_term_id: "REC: term_ra.id"
          product_id: "REC: product_ra.id"
          name: "Extracurricular Fee Fee Analysis RA"
          account_id: "REC: income_account_ra.id"
          uom_quantity: 1.0
          price_unit: 400000.0

      - step: "Confirm participant"
        action: "call"
        target: "participant_ra"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve participant, creating the addendum fee line"
        action: "call"
        target: "participant_ra"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Search the analysis row for this participant"
        action: "search"
        model: "school_extracurricular_fee_analysis"
        domain: [["participant_id", "=", "REC: participant_ra.id"]]
        save_as: "row_ra"
        expect_count: 1

      - step: "Assert the row is tagged as the enrollment billing route"
        action: "assert"
        target: "row_ra"
        asserts:
          billing_route:
            type: "value"
            expected: "enrollment"
          offering_id:
            type: "m2o"
            expected: "REC: offering_ra"
          extracurricular_id:
            type: "m2o"
            expected: "REC: extracurricular_ra"
          category_id:
            type: "m2o"
            expected: "REC: category_ra"
          student_id:
            type: "m2o"
            expected: "REC: student_ra"
          partner_id:
            type: "m2o"
            expected: "REC: contact_ra"
          school_id:
            type: "m2o"
            expected: "REC: school_ra"
          academic_year_id:
            type: "m2o"
            expected: "REC: academic_year_ra"
          academic_term_id:
            type: "m2o"
            expected: "REC: academic_term_ra"
          teacher_id:
            type: "m2o"
            expected: "REC: teacher_ra"
          product_id:
            type: "m2o"
            expected: "REC: product_ra"
          customer_invoice_id:
            type: "value"
            operator: "is_falsy"

      - step: "Search the addendum fee line the analysis row derives from"
        action: "search"
        model: "school_enrollment_payment_term_extra_detail"
        domain: [["participant_id", "=", "REC: participant_ra.id"]]
        save_as: "extra_detail_ra"
        expect_count: 1

      - step: "Assert the row amounts match its own source line, the addendum fee line"
        action: "assert"
        target: "row_ra"
        asserts:
          uom_quantity:
            type: "value"
            expected: "REC: extra_detail_ra.uom_quantity"
          price_unit:
            type: "value"
            expected: "REC: extra_detail_ra.price_unit"
          price_subtotal:
            type: "value"
            expected: "REC: extra_detail_ra.price_subtotal"
          price_tax:
            type: "value"
            expected: "REC: extra_detail_ra.price_tax"
          price_total:
            type: "value"
            expected: "REC: extra_detail_ra.price_total"

