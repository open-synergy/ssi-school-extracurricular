        domain: [["participant_id", "=", "REC: participant_ac.id"]]
        save_as: "row_ac"
        expect_count: 1

      - step: "Create a plain internal user without the fee analysis group"
        action: "create"
        model: "res.users"
        save_as: "plain_user_ac"
        values:
          name: "No Fee Analysis Access AC"
          login: "no_fee_analysis_access_ac@example.com"
          groups_id: [[6, 0, ["REF: base.group_user"]]]

      - step: "Plain user reading the analysis row must be denied"
        action: "call"
