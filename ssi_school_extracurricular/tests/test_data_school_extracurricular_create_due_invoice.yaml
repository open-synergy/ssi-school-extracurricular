options:
  auto_refresh: true

scenarios:
  - name:
      "Create due invoice consolidates two participants of the same student into one
      invoice"
    steps:
      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type_cw"
        values:
          name: "Grade Type Wizard CW"
          code: "EXTWIZ-GT-CW"

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school_cw"
        values:
          name: "School Wizard CW"
          code: "EXTWIZ-SCH-CW"
          grade_type_id: "REC: grade_type_cw.id"

      - step: "Setup - create category"
        action: "create"
        model: "school_extracurricular_category"
        save_as: "category_cw"
        values:
          name: "Category Wizard CW"
          code: "EXTWIZ-CAT-CW"

      - step: "Setup - create first extracurricular"
        action: "create"
        model: "school_extracurricular"
        save_as: "extracurricular_cw_1"
        values:
          name: "Chess Club Wizard CW"
          code: "EXTWIZ-EXT-CW-1"
          category_id: "REC: category_cw.id"
          school_id: "REC: school_cw.id"

      - step: "Setup - create second extracurricular"
        action: "create"
        model: "school_extracurricular"
        save_as: "extracurricular_cw_2"
        values:
          name: "Robotics Club Wizard CW"
          code: "EXTWIZ-EXT-CW-2"
          category_id: "REC: category_cw.id"
          school_id: "REC: school_cw.id"

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year_cw"
        values:
          name: "AY Wizard CW"
          code: "EXTWIZ-AY-CW"
          date_start: 2024-07-01
          date_end: 2025-06-30

      - step: "Setup - create academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term_cw"
        values:
          name: "Term Wizard CW"
          code: "EXTWIZ-TERM-CW"
          date_start: 2024-07-01
          date_end: 2024-12-31
          year_id: "REC: academic_year_cw.id"

      - step: "Setup - create employee for teacher"
        action: "create"
        model: "hr.employee"
        save_as: "employee_cw"
        values:
          name: "Teacher Employee Wizard CW"

      - step: "Setup - create teacher"
        action: "create"
        model: "school_teacher"
        save_as: "teacher_cw"
        values:
          name: "Teacher Wizard CW"
          code: "EXTWIZ-TCH-CW"
          employee_id: "REC: employee_cw.id"

      - step: "Setup - create first offering product"
        action: "create"
        model: "product.product"
        save_as: "product_cw_1"
        values:
          name: "Chess Club Fee Wizard CW"

      - step: "Setup - create second offering product"
        action: "create"
        model: "product.product"
        save_as: "product_cw_2"
        values:
          name: "Robotics Club Fee Wizard CW"

      - step: "Setup - get revenue account type"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "revenue_type_cw"

      - step: "Setup - create income account"
        action: "create"
        model: "account.account"
        save_as: "income_account_cw"
        values:
          name: "Extracurricular Wizard Income CW"
          code: "EXTWIZ-INC-CW"
          user_type_id: "REC: revenue_type_cw.id"

      - step: "Setup - get receivable account type"
        action: "ref"
        xml_id: "account.data_account_type_receivable"
        save_as: "receivable_type_cw"

      - step: "Setup - create receivable account"
        action: "create"
        model: "account.account"
        save_as: "receivable_account_cw"
        values:
          name: "Extracurricular Wizard Receivable CW"
          code: "EXTWIZ-REC-CW"
          user_type_id: "REC: receivable_type_cw.id"
          reconcile: true

      - step: "Setup - create receivable journal"
        action: "create"
        model: "account.journal"
        save_as: "journal_cw"
        values:
          name: "Extracurricular Wizard Journal CW"
          code: "EXTWZCW"
          type: "sale"

      - step: "Setup - create customer invoice type"
        action: "create"
        model: "customer_invoice_type"
        save_as: "invoice_type_cw"
        values:
          name: "Extracurricular Wizard Invoice Type CW"
          code: "/"
          journal_id: "REC: journal_cw.id"
          receivable_account_id: "REC: receivable_account_cw.id"

      - step: "Setup - create first offering, billing mode standalone"
        action: "create"
        model: "school_extracurricular_offering"
        save_as: "offering_cw_1"
        values:
          extracurricular_id: "REC: extracurricular_cw_1.id"
          academic_year_id: "REC: academic_year_cw.id"
          academic_term_id: "REC: academic_term_cw.id"
          teacher_id: "REC: teacher_cw.id"
          date_start: 2024-07-01
          date_end: 2024-12-31
          product_id: "REC: product_cw_1.id"
          price_unit: 300000.0
          billing_mode: "standalone"
          customer_invoice_type_id: "REC: invoice_type_cw.id"
          receivable_journal_id: "REC: journal_cw.id"
          receivable_account_id: "REC: receivable_account_cw.id"

      - step: "Setup - create second offering, same accounting setup"
        action: "create"
        model: "school_extracurricular_offering"
        save_as: "offering_cw_2"
        values:
          extracurricular_id: "REC: extracurricular_cw_2.id"
          academic_year_id: "REC: academic_year_cw.id"
          academic_term_id: "REC: academic_term_cw.id"
          teacher_id: "REC: teacher_cw.id"
          date_start: 2024-07-01
          date_end: 2024-12-31
          product_id: "REC: product_cw_2.id"
          price_unit: 200000.0
          billing_mode: "standalone"
          customer_invoice_type_id: "REC: invoice_type_cw.id"
          receivable_journal_id: "REC: journal_cw.id"
          receivable_account_id: "REC: receivable_account_cw.id"

      - step: "Setup - create grade"
        action: "create"
        model: "school_grade"
        save_as: "grade_cw"
        values:
          name: "Grade Wizard CW"
          code: "EXTWIZ-GR-CW"
          type_id: "REC: grade_type_cw.id"

      - step: "Setup - create grade class"
        action: "create"
        model: "school_grade_class"
        save_as: "grade_class_cw"
        values:
          name: "Grade Class Wizard CW"
          code: "EXTWIZ-GC-CW"
          school_id: "REC: school_cw.id"
          grade_id: "REC: grade_cw.id"

      - step: "Setup - create student contact"
        action: "create"
        model: "res.partner"
        save_as: "contact_cw"
        values:
          name: "Student Contact Wizard CW"

      - step: "Setup - create student"
        action: "create"
        model: "school_student"
        save_as: "student_cw"
        values:
          name: "Student Wizard CW"
          code: "EXTWIZ-ST-CW"
          contact_id: "REC: contact_cw.id"
          school_id: "REC: school_cw.id"

      - step: "Setup - create the student's enrollment for the term"
        action: "create"
        model: "school_enrollment"
        save_as: "enrollment_cw"
        values:
          academic_year_id: "REC: academic_year_cw.id"
          academic_term_id: "REC: academic_term_cw.id"
          school_id: "REC: school_cw.id"
          grade_id: "REC: grade_cw.id"
          grade_class_id: "REC: grade_class_cw.id"
          student_id: "REC: student_cw.id"

      - step: "Create first participant (first extracurricular)"
        action: "create"
        model: "school_extracurricular_participant"
        save_as: "participant_cw_1"
        values:
          offering_id: "REC: offering_cw_1.id"
          student_id: "REC: student_cw.id"
          enrollment_id: "REC: enrollment_cw.id"
          billing_mode: "standalone"
          product_id: "REC: product_cw_1.id"
          uom_quantity: 1.0
          price_unit: 300000.0

      - step: "Confirm first participant"
        action: "call"
        target: "participant_cw_1"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve first participant"
        action: "call"
        target: "participant_cw_1"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Create second participant (second extracurricular)"
        action: "create"
        model: "school_extracurricular_participant"
        save_as: "participant_cw_2"
        values:
          offering_id: "REC: offering_cw_2.id"
          student_id: "REC: student_cw.id"
          enrollment_id: "REC: enrollment_cw.id"
          billing_mode: "standalone"
          product_id: "REC: product_cw_2.id"
          uom_quantity: 1.0
          price_unit: 200000.0

      - step: "Confirm second participant"
        action: "call"
        target: "participant_cw_2"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve second participant"
        action: "call"
        target: "participant_cw_2"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Create payment term for the first participant"
        action: "create"
        model: "school_extracurricular_payment_term"
        save_as: "term_cw_1"
        values:
          participant_id: "REC: participant_cw_1.id"
          name: "Chess Club Term 1 CW"
          date_due: 2024-06-15

      - step: "Create detail line for the first term"
        action: "create"
        model: "school_extracurricular_payment_term_detail"
        save_as: "detail_cw_1"
        values:
          term_id: "REC: term_cw_1.id"
          product_id: "REC: product_cw_1.id"
          name: "Chess Club Fee CW"
          account_id: "REC: income_account_cw.id"
          uom_quantity: 1.0
          price_unit: 300000.0

      - step: "Create payment term for the second participant"
        action: "create"
        model: "school_extracurricular_payment_term"
        save_as: "term_cw_2"
        values:
          participant_id: "REC: participant_cw_2.id"
          name: "Robotics Club Term 1 CW"
          date_due: 2024-06-20

      - step: "Create detail line for the second term"
        action: "create"
        model: "school_extracurricular_payment_term_detail"
        save_as: "detail_cw_2"
        values:
          term_id: "REC: term_cw_2.id"
          product_id: "REC: product_cw_2.id"
          name: "Robotics Club Fee CW"
          account_id: "REC: income_account_cw.id"
          uom_quantity: 1.0
          price_unit: 200000.0

      - step: "Both terms are uninvoiced and due before the cut-off"
        action: "assert"
        target: "term_cw_1"
        asserts:
          state:
            type: "value"
            expected: "uninvoiced"

      - step: "Create the wizard for the consolidated student"
        action: "create"
        model: "school_extracurricular_create_due_invoice"
        save_as: "wizard_cw"
        values:
          student_id: "REC: student_cw.id"
          date_invoice: 2024-06-01
          date_due_max: 2024-06-30

      - step: "The wizard picked up both due payment terms"
        action: "assert"
        target: "wizard_cw"
        asserts:
          term_ids:
            type: "m2m"
            check: "count"
            expected_count: 2

      - step: "Run the wizard"
        action: "call"
        target: "wizard_cw"
        method: "action_create_invoice"
        as_user: "base.user_admin"

      - step: "The first term is now invoiced"
        action: "assert"
        target: "term_cw_1"
        asserts:
          state:
            type: "value"
            expected: "invoiced"

      - step: "The second term is now invoiced, on the SAME invoice"
        action: "assert"
        target: "term_cw_2"
        asserts:
          state:
            type: "value"
            expected: "invoiced"
          customer_invoice_id:
            type: "m2o"
            expected: "REC: term_cw_1.customer_invoice_id"

      - step: "The consolidated invoice has one line per detail"
        action: "assert"
        target: "term_cw_1"
        asserts:
          customer_invoice_id.line_ids:
            type: "o2m"
            check: "count"
            expected_count: 2

  - name: "Wizard auto-confirms the invoice when the offering enables it"
