          academic_year_id: "REC: academic_year_ac.id"
          academic_term_id: "REC: academic_term_ac.id"
          teacher_id: "REC: teacher_ac.id"
          date_start: 2024-07-01
          date_end: 2024-12-31
          product_id: "REC: product_ac.id"
          price_unit: 300000.0
          billing_mode: "standalone"
          customer_invoice_type_id: "REC: invoice_type_ac.id"
          receivable_journal_id: "REC: journal_ac.id"
