  - name: "Wizard rejects due terms whose offerings disagree on accounting setup"
    steps:
      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type_mm"
        values:
          name: "Grade Type Wizard MM"
          code: "EXTWIZ-GT-MM"

      - step: "Setup - create school"
