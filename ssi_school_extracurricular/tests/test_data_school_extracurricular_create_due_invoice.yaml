      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type_nd"
        values:
          name: "Grade Type Wizard ND"
          code: "EXTWIZ-GT-ND"

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school_nd"
        values:
          name: "School Wizard ND"
          code: "EXTWIZ-SCH-ND"
          grade_type_id: "REC: grade_type_nd.id"

      - step: "Setup - create student contact"
        action: "create"
        model: "res.partner"
        save_as: "contact_nd"
        values:
          name: "Student Contact Wizard ND"

      - step: "Setup - create student with no participation at all"
        action: "create"
        model: "school_student"
        save_as: "student_nd"
        values:
          name: "Student Wizard ND"
          code: "EXTWIZ-ST-ND"
          contact_id: "REC: contact_nd.id"
          school_id: "REC: school_nd.id"

      - step: "Create the wizard for a student with nothing due"
        action: "create"
        model: "school_extracurricular_create_due_invoice"
        save_as: "wizard_nd"
        values:
          student_id: "REC: student_nd.id"
          date_invoice: 2024-06-01
          date_due_max: 2024-06-30

      - step: "The wizard picked up no payment term"
        action: "assert"
        target: "wizard_nd"
        asserts:
          term_ids:
            type: "m2m"
            check: "count"
            expected_count: 0

      - step: "Running the wizard must fail with nothing due"
        action: "call"
        target: "wizard_nd"
        method: "action_create_invoice"
        as_user: "base.user_admin"
        expect_error:
          type: "UserError"
          message_contains: "No uninvoiced payment term of Student"
