options:
  auto_refresh: true
scenarios:
  - name: "Onchange Final Account From Product Usage On Allocation"
    steps:
      - step: "Setup - get revenue account type"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "revenue_type_rr1"

      - step: "Setup - create final income account"
        action: "create"
        model: "account.account"
        save_as: "final_account_rr1"
        values:
          name: "Extracurricular Final Income RR1"
          code: "EXRR1-4200"
          user_type_id: "REC: revenue_type_rr1.id"

      - step: "Setup - create final usage type"
        action: "create"
        model: "product.usage_type"
        save_as: "final_usage_rr1"
        values:
          name: "Final Revenue RR1"
          code: "FINEXRR1"
          account_id: "REC: final_account_rr1.id"

      - step: "Setup - create product"
        action: "create"
        model: "product.product"
        save_as: "product_rr1"
        values:
          name: "Extracurricular Fee RR1"
          type: "service"
          list_price: 300000.0

      - step:
          "Selecting Final Usage fills Final Account from the product's usage account"
        action: form
        model: "school_extracurricular_participant_allocation"
        save: false
        values:
          product_id: "REC: product_rr1"
          final_usage_id: "REC: final_usage_rr1"
        asserts:
          final_account_id.id:
            type: "value"
            expected: "REC: final_account_rr1.id"

      - step: "Without Final Usage selected, Final Account stays empty"
        action: form
        model: "school_extracurricular_participant_allocation"
        save: false
        values:
          product_id: "REC: product_rr1"
        asserts:
          final_account_id:
            type: "value"
            operator: "is_falsy"

  - name: "Open Participant Copies Final Usage And Account To Extra Detail"
    steps:
      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type_rr2"
        values:
          name: "Grade Type RR2"
          code: "EXRR2-GT"

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school_rr2"
        values:
          name: "School RR2"
          code: "EXRR2-SCH"
          grade_type_id: "REC: grade_type_rr2.id"

      - step: "Setup - create category"
        action: "create"
        model: "school_extracurricular_category"
        save_as: "category_rr2"
        values:
          name: "Category RR2"
          code: "EXRR2-CAT"

      - step: "Setup - create extracurricular"
        action: "create"
        model: "school_extracurricular"
        save_as: "extracurricular_rr2"
        values:
          name: "Chess Club RR2"
          code: "EXRR2-EXT"
          category_id: "REC: category_rr2.id"
          school_id: "REC: school_rr2.id"

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year_rr2"
        values:
          name: "AY RR2"
          code: "EXRR2-AY"
          date_start: 2026-07-01
          date_end: 2027-06-30

      - step: "Setup - create academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term_rr2"
        values:
          name: "Term RR2"
          code: "EXRR2-TM"
          date_start: 2026-07-01
          date_end: 2026-12-31
          year_id: "REC: academic_year_rr2.id"

      - step: "Setup - create employee for teacher"
        action: "create"
        model: "hr.employee"
        save_as: "employee_rr2"
        values:
          name: "Teacher Employee RR2"

      - step: "Setup - create teacher"
        action: "create"
        model: "school_teacher"
        save_as: "teacher_rr2"
        values:
          name: "Teacher RR2"
          code: "EXRR2-TCH"
          employee_id: "REC: employee_rr2.id"

      - step: "Setup - create offering product"
        action: "create"
        model: "product.product"
        save_as: "product_rr2"
        values:
          name: "Extracurricular Fee RR2"

      - step: "Setup - create offering"
        action: "create"
        model: "school_extracurricular_offering"
        save_as: "offering_rr2"
        values:
          extracurricular_id: "REC: extracurricular_rr2.id"
          academic_year_id: "REC: academic_year_rr2.id"
          academic_term_id: "REC: academic_term_rr2.id"
          teacher_id: "REC: teacher_rr2.id"
          date_start: 2026-07-01
          date_end: 2026-12-31
          product_id: "REC: product_rr2.id"
          price_unit: 300000.0

      - step: "Setup - create grade"
        action: "create"
        model: "school_grade"
        save_as: "grade_rr2"
        values:
          name: "Grade RR2"
          code: "EXRR2-GR"
          type_id: "REC: grade_type_rr2.id"

      - step: "Setup - create grade class"
        action: "create"
        model: "school_grade_class"
        save_as: "grade_class_rr2"
        values:
          name: "Grade Class RR2"
          code: "EXRR2-GC"
          school_id: "REC: school_rr2.id"
          grade_id: "REC: grade_rr2.id"

      - step: "Setup - create student contact"
        action: "create"
        model: "res.partner"
        save_as: "contact_rr2"
        values:
          name: "Student Contact RR2"

      - step: "Setup - create student"
        action: "create"
        model: "school_student"
        save_as: "student_rr2"
        values:
          name: "Student RR2"
          code: "EXRR2-ST"
          contact_id: "REC: contact_rr2.id"
          school_id: "REC: school_rr2.id"

      - step: "Setup - create enrollment"
        action: "create"
        model: "school_enrollment"
        save_as: "enrollment_rr2"
        values:
          academic_year_id: "REC: academic_year_rr2.id"
          academic_term_id: "REC: academic_term_rr2.id"
          school_id: "REC: school_rr2.id"
          grade_id: "REC: grade_rr2.id"
          grade_class_id: "REC: grade_class_rr2.id"
          student_id: "REC: student_rr2.id"

      - step: "Create participant"
        action: "create"
        model: "school_extracurricular_participant"
        save_as: "participant_rr2"
        values:
          offering_id: "REC: offering_rr2.id"
          student_id: "REC: student_rr2.id"
          enrollment_id: "REC: enrollment_rr2.id"
          billing_mode: "enrollment"
          product_id: "REC: product_rr2.id"
          uom_quantity: 1.0
          price_unit: 300000.0

      - step: "Setup - get revenue account type"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "revenue_type_rr2"

      - step: "Setup - create temporary income account"
        action: "create"
        model: "account.account"
        save_as: "income_account_rr2"
        values:
          name: "Extracurricular Income RR2"
          code: "EXRR2-4100"
          user_type_id: "REC: revenue_type_rr2.id"

      - step: "Setup - create final income account"
        action: "create"
        model: "account.account"
        save_as: "final_account_rr2"
        values:
          name: "Extracurricular Final Income RR2"
          code: "EXRR2-4200"
          user_type_id: "REC: revenue_type_rr2.id"

      - step: "Setup - create final usage type"
        action: "create"
        model: "product.usage_type"
        save_as: "final_usage_rr2"
        values:
          name: "Final Revenue RR2"
          code: "FINEXRR2"
          account_id: "REC: final_account_rr2.id"

      - step: "Setup - create payment term to allocate the fee to"
        action: "create"
        model: "school_enrollment_payment_term"
        save_as: "term_rr2"
        values:
          enrollment_id: "REC: enrollment_rr2.id"
          name: "Term RR2"

      - step: "Allocate the participant's fee, with a Final Usage/Account"
        action: "create"
        model: "school_extracurricular_participant_allocation"
        save_as: "allocation_rr2"
        values:
          participant_id: "REC: participant_rr2.id"
          payment_term_id: "REC: term_rr2.id"
          product_id: "REC: product_rr2.id"
          name: "Extracurricular Fee RR2"
          account_id: "REC: income_account_rr2.id"
          final_usage_id: "REC: final_usage_rr2.id"
          final_account_id: "REC: final_account_rr2.id"
          uom_quantity: 1.0
          price_unit: 300000.0

      - step: "Confirm participant"
        action: "call"
        target: "participant_rr2"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve participant"
        action: "call"
        target: "participant_rr2"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "The addendum line was created with one extra detail"
        action: "assert"
        target: "term_rr2"
        asserts:
          extra_detail_ids:
            type: "o2m"
            check: "count"
            expected_count: 1

      - step: "Get the created extra detail"
        action: "search"
        model: "school_enrollment_payment_term_extra_detail"
        domain: [["term_id", "=", "REC: term_rr2.id"]]
        save_as: "extra_detail_rr2"
        expect_count: 1

      - step: "Extra detail copied Final Usage and Final Account"
        action: "assert"
        target: "extra_detail_rr2"
        asserts:
          final_usage_id:
            type: "m2o"
            expected: "REC: final_usage_rr2"
          final_account_id:
            type: "m2o"
            expected: "REC: final_account_rr2"

  - name: "Route A Extracurricular Addendum Fee Recognized At Enrollment Done"
    steps:
      - step: "Setup - get sale journal"
        action: "search"
        model: "account.journal"
        domain: [["type", "=", "sale"]]
        save_as: "journal_rr3"
        limit: 1

      - step: "Setup - get revenue account type"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "revenue_type_rr3"

      - step: "Setup - get receivable account type"
        action: "ref"
        xml_id: "account.data_account_type_receivable"
        save_as: "receivable_type_rr3"

      - step: "Setup - create temporary income account"
        action: "create"
        model: "account.account"
        save_as: "income_account_rr3"
        values:
          name: "Extracurricular Income RR3"
          code: "EXRR3-4100"
          user_type_id: "REC: revenue_type_rr3.id"

      - step: "Setup - create final income account"
        action: "create"
        model: "account.account"
        save_as: "final_account_rr3"
        values:
          name: "Extracurricular Final Income RR3"
          code: "EXRR3-4200"
          user_type_id: "REC: revenue_type_rr3.id"

      - step: "Setup - create receivable account"
        action: "create"
        model: "account.account"
        save_as: "receivable_account_rr3"
        values:
          name: "School Receivable RR3"
          code: "EXRR3-1100"
          user_type_id: "REC: receivable_type_rr3.id"
          reconcile: true

      - step: "Setup - create final usage type"
        action: "create"
        model: "product.usage_type"
        save_as: "final_usage_rr3"
        values:
          name: "Final Revenue RR3"
          code: "FINEXRR3"
          account_id: "REC: final_account_rr3.id"

      - step: "Setup - create customer invoice type"
        action: "create"
        model: "customer_invoice_type"
        save_as: "ci_type_rr3"
        values:
          name: "Customer Invoice Type RR3"
          code: "CITEXRR3"
          journal_id: "REC: journal_rr3.id"
          receivable_account_id: "REC: receivable_account_rr3.id"

      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type_rr3"
        values:
          name: "Grade Type RR3"
          code: "EXRR3-GT"

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school_rr3"
        values:
          name: "School RR3"
          code: "EXRR3-SCH"
          grade_type_id: "REC: grade_type_rr3.id"

      - step: "Setup - create category"
        action: "create"
        model: "school_extracurricular_category"
        save_as: "category_rr3"
        values:
          name: "Category RR3"
          code: "EXRR3-CAT"

      - step: "Setup - create extracurricular"
        action: "create"
        model: "school_extracurricular"
        save_as: "extracurricular_rr3"
        values:
          name: "Chess Club RR3"
          code: "EXRR3-EXT"
          category_id: "REC: category_rr3.id"
          school_id: "REC: school_rr3.id"

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year_rr3"
        values:
          name: "AY RR3"
          code: "EXRR3-AY"
          date_start: 2026-07-01
          date_end: 2027-06-30

      - step: "Setup - create academic term 1 (enrollment open, not last)"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term_rr3"
        values:
          name: "Semester 1 RR3"
          code: "EXRR3-TM1"
          date_start: 2026-07-01
          date_end: 2026-12-31
          year_id: "REC: academic_year_rr3.id"
          enrollment_state: "open"

      - step: "Setup - create academic term 2 (last term, unused)"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term_2_rr3"
        values:
          name: "Semester 2 RR3"
          code: "EXRR3-TM2"
          date_start: 2027-01-01
          date_end: 2027-06-30
          year_id: "REC: academic_year_rr3.id"
          enrollment_state: "close"

      - step: "Setup - create employee for teacher"
        action: "create"
        model: "hr.employee"
        save_as: "employee_rr3"
        values:
          name: "Teacher Employee RR3"

      - step: "Setup - create teacher"
        action: "create"
        model: "school_teacher"
        save_as: "teacher_rr3"
        values:
          name: "Teacher RR3"
          code: "EXRR3-TCH"
          employee_id: "REC: employee_rr3.id"

      - step: "Setup - create offering product"
        action: "create"
        model: "product.product"
        save_as: "product_rr3"
        values:
          name: "Extracurricular Fee RR3"

      - step: "Setup - create offering"
        action: "create"
        model: "school_extracurricular_offering"
        save_as: "offering_rr3"
        values:
          extracurricular_id: "REC: extracurricular_rr3.id"
          academic_year_id: "REC: academic_year_rr3.id"
          academic_term_id: "REC: academic_term_rr3.id"
          teacher_id: "REC: teacher_rr3.id"
          date_start: 2026-07-01
          date_end: 2026-12-31
          product_id: "REC: product_rr3.id"
          price_unit: 300000.0

      - step: "Setup - create grade"
        action: "create"
        model: "school_grade"
        save_as: "grade_rr3"
        values:
          name: "Grade RR3"
          code: "EXRR3-GR"
          type_id: "REC: grade_type_rr3.id"

      - step: "Setup - create grade class"
        action: "create"
        model: "school_grade_class"
        save_as: "grade_class_rr3"
        values:
          name: "Grade Class RR3"
          code: "EXRR3-GC"
          school_id: "REC: school_rr3.id"
          grade_id: "REC: grade_rr3.id"

      - step: "Setup - create student contact"
        action: "create"
        model: "res.partner"
        save_as: "contact_rr3"
        values:
          name: "Student Contact RR3"

      - step: "Setup - create student"
        action: "create"
        model: "school_student"
        save_as: "student_rr3"
        values:
          name: "Student RR3"
          code: "EXRR3-ST"
          contact_id: "REC: contact_rr3.id"
          school_id: "REC: school_rr3.id"

      - step: "Setup - create enrollment with Revenue Recognition enabled"
        action: "create"
        model: "school_enrollment"
        save_as: "enrollment_rr3"
        values:
          date: 2026-07-01
          academic_year_id: "REC: academic_year_rr3.id"
          academic_term_id: "REC: academic_term_rr3.id"
          school_id: "REC: school_rr3.id"
          grade_id: "REC: grade_rr3.id"
          grade_class_id: "REC: grade_class_rr3.id"
          student_id: "REC: student_rr3.id"
          currency_id: "REC: company.currency_id.id"
          receivable_journal_id: "REC: journal_rr3.id"
          receivable_account_id: "REC: receivable_account_rr3.id"
          customer_invoice_type_id: "REC: ci_type_rr3.id"
          revenue_recognition: true
          recognition_journal_id: "REC: journal_rr3.id"

      - step: "Create the enrollment payment term the fee is allocated to"
        action: "create"
        model: "school_enrollment_payment_term"
        save_as: "term_rr3"
        values:
          enrollment_id: "REC: enrollment_rr3.id"
          name: "Term RR3"

      - step: "Create participant, billed to enrollment"
        action: "create"
        model: "school_extracurricular_participant"
        save_as: "participant_rr3"
        values:
          offering_id: "REC: offering_rr3.id"
          student_id: "REC: student_rr3.id"
          enrollment_id: "REC: enrollment_rr3.id"
          billing_mode: "enrollment"
          product_id: "REC: product_rr3.id"
          uom_quantity: 1.0
          price_unit: 300000.0

      - step: "Allocate the fee, with a Final Usage/Account"
        action: "create"
        model: "school_extracurricular_participant_allocation"
        save_as: "allocation_rr3"
        values:
          participant_id: "REC: participant_rr3.id"
          payment_term_id: "REC: term_rr3.id"
          product_id: "REC: product_rr3.id"
          name: "Extracurricular Fee RR3"
          account_id: "REC: income_account_rr3.id"
          final_usage_id: "REC: final_usage_rr3.id"
          final_account_id: "REC: final_account_rr3.id"
          uom_quantity: 1.0
          price_unit: 300000.0

      - step: "Confirm the participant"
        action: "call"
        target: "participant_rr3"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve the participant"
        action: "call"
        target: "participant_rr3"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Confirm enrollment"
        action: "call"
        target: "enrollment_rr3"
        method: "action_confirm"
        as_user: "base.user_admin"

      - step: "Assert enrollment is confirm before approve (forces refresh, T-04)"
        action: "assert"
        target: "enrollment_rr3"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve enrollment"
        action: "call"
        target: "enrollment_rr3"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Invoice the term carrying the addendum fee line"
        action: "call"
        target: "term_rr3"
        method: "action_create_invoice"
        as_user: "base.user_admin"

      - step: "Get the generated invoice"
        action: "search"
        model: "customer_invoice"
        domain: [["id", "=", "REC: term_rr3.customer_invoice_id.id"]]
        save_as: "invoice_rr3"
        expect_count: 1

      - step: "The invoice has one line, matching the extra detail"
        action: "assert"
        target: "invoice_rr3"
        asserts:
          line_ids:
            type: "o2m"
            check: "count"
            expected_count: 1

      - step: "Confirm the invoice"
        action: "call"
        target: "invoice_rr3"
        method: "action_confirm"
        as_user: "base.user_admin"

      - step: "Assert invoice is confirm before approve (forces refresh, T-04)"
        action: "assert"
        target: "invoice_rr3"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Open the invoice"
        action: "call"
        target: "invoice_rr3"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Assert the enrollment's term is not the last term (done is allowed)"
        action: "assert"
        target: "enrollment_rr3"
        asserts:
          academic_term_id.last_term:
            type: "value"
            expected: false

      - step: "Finish the enrollment"
        action: "call"
        target: "enrollment_rr3"
        method: "action_done"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "done"

      - step: "Assert one Revenue Recognition line was posted for the addendum"
        action: "search"
        model: "school_enrollment_revenue_recognition_line"
        domain: [["enrollment_id", "=", "REC: enrollment_rr3.id"]]
        save_as: "recognition_lines_rr3"
        expect_count: 1

      - step: "Get the extra detail the line traces back to"
        action: "search"
        model: "school_enrollment_payment_term_extra_detail"
        domain: [["term_id", "=", "REC: term_rr3.id"]]
        save_as: "extra_detail_rr3"
        expect_count: 1

      - step: "Assert the recognition line's trace, accounts, and amount"
        action: "search"
        model: "school_enrollment_revenue_recognition_line"
        domain: [["extra_detail_id", "=", "REC: extra_detail_rr3.id"]]
        save_as: "recognition_line_rr3"
        expect_count: 1

      - step: "Assert recognition line accounts and amount"
        action: "assert"
        target: "recognition_line_rr3"
        asserts:
          debit_account_id.id:
            type: "value"
            expected: "REC: income_account_rr3.id"
          credit_account_id.id:
            type: "value"
            expected: "REC: final_account_rr3.id"
          amount:
            type: "value"
            expected: 300000.0

  - name: "Route B Standalone Extracurricular Fee Recognized At Enrollment Done"
    steps:
      - step: "Setup - get sale journal"
