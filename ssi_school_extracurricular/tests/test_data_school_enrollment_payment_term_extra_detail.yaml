          academic_term_id: "REC: academic_term_t9.id"
          school_id: "REC: school_t9.id"
          grade_id: "REC: grade_t9.id"
          grade_class_id: "REC: grade_class_t9.id"
          student_id: "REC: student_t9.id"
          currency_id: "REC: company.currency_id.id"

      - step: "Setup - create payment term"
        action: "create"
        model: "school_enrollment_payment_term"
        save_as: "term_t9"
        values:
          enrollment_id: "REC: enrollment_t9.id"
          name: "Term Billing T9"

      - step: "Create participant billed to enrollment"
        action: "create"
        model: "school_extracurricular_participant"
        save_as: "participant_t9"
        values:
          offering_id: "REC: offering_t9.id"
          student_id: "REC: student_t9.id"
          enrollment_id: "REC: enrollment_t9.id"
          billing_mode: "enrollment"
          product_id: "REC: product_offering_t9.id"
          uom_quantity: 1.0
          price_unit: 600000.0

      - step: "Create allocation covering the full fee on the term"
        action: "create"
        model: "school_extracurricular_participant_allocation"
        save_as: "allocation_t9"
        values:
          participant_id: "REC: participant_t9.id"
          payment_term_id: "REC: term_t9.id"
          product_id: "REC: product_offering_t9.id"
          name: "Extracurricular Fee Billing T9"
          account_id: "REC: income_account_t9.id"
          uom_quantity: 1.0
          price_unit: 600000.0

      - step: "Confirm participant"
        action: "call"
        target: "participant_t9"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve participant, opening it and creating the addendum line"
        action: "call"
        target: "participant_t9"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Confirm the enrollment"
        action: "call"
        target: "enrollment_t9"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve the enrollment, locking the payment term and its addendum line"
        action: "call"
        target: "enrollment_t9"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Assert the addendum line is now locked"
        action: "assert"
        target: "allocation_t9"
        asserts:
          extra_detail_id.locked:
            type: "value"
            expected: true

      - step: "Cancelling the participant must now fail"
        action: "call"
        target: "participant_t9"
        method: "action_cancel"
        as_user: "base.user_admin"
        expect_error:
          type: "UserError"
          message_contains: "already locked"
