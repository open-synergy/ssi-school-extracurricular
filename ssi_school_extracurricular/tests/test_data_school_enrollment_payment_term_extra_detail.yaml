options:
  auto_refresh: true

scenarios:
  - name: "Extra amount stays separate from the regular untaxed amount"
    steps:
      - step: "Setup - get revenue account type"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "revenue_type_t1"

      - step: "Setup - create income account"
        action: "create"
        model: "account.account"
        save_as: "income_account_t1"
        values:
          name: "Extracurricular Billing Income T1"
          code: "EXTB-T1-INC"
          user_type_id: "REC: revenue_type_t1.id"

      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type_t1"
        values:
          name: "Grade Type Billing T1"
          code: "EXTB-GT-T1"

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school_t1"
        values:
          name: "School Billing T1"
          code: "EXTB-SCH-T1"
          grade_type_id: "REC: grade_type_t1.id"

      - step: "Setup - create category"
        action: "create"
        model: "school_extracurricular_category"
        save_as: "category_t1"
        values:
          name: "Category Billing T1"
          code: "EXTB-CAT-T1"

      - step: "Setup - create extracurricular"
        action: "create"
        model: "school_extracurricular"
        save_as: "extracurricular_t1"
        values:
          name: "Futsal Club Billing T1"
          code: "EXTB-EXT-T1"
          category_id: "REC: category_t1.id"
          school_id: "REC: school_t1.id"

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year_t1"
        values:
          name: "AY Billing T1"
          code: "EXTB-AY-T1"
          date_start: 2026-07-01
          date_end: 2027-06-30

      - step: "Setup - create academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term_t1"
        values:
          name: "Term Billing T1"
          code: "EXTB-TERM-T1"
          date_start: 2026-07-01
          date_end: 2026-12-31
          year_id: "REC: academic_year_t1.id"
          enrollment_state: "open"

      - step: "Setup - create employee for teacher"
        action: "create"
        model: "hr.employee"
        save_as: "employee_t1"
        values:
          name: "Teacher Employee Billing T1"

      - step: "Setup - create teacher"
        action: "create"
        model: "school_teacher"
        save_as: "teacher_t1"
        values:
          name: "Teacher Billing T1"
          code: "EXTB-TCH-T1"
          employee_id: "REC: employee_t1.id"

      - step: "Setup - create offering product"
        action: "create"
        model: "product.product"
        save_as: "product_offering_t1"
        values:
          name: "Extracurricular Fee Billing T1"

      - step: "Setup - create offering"
        action: "create"
        model: "school_extracurricular_offering"
        save_as: "offering_t1"
        values:
          extracurricular_id: "REC: extracurricular_t1.id"
          academic_year_id: "REC: academic_year_t1.id"
          academic_term_id: "REC: academic_term_t1.id"
          teacher_id: "REC: teacher_t1.id"
          date_start: 2026-07-01
          date_end: 2026-12-31
          product_id: "REC: product_offering_t1.id"
          price_unit: 600000.0

      - step: "Setup - create grade"
        action: "create"
        model: "school_grade"
        save_as: "grade_t1"
        values:
          name: "Grade Billing T1"
          code: "EXTB-GR-T1"
          type_id: "REC: grade_type_t1.id"

      - step: "Setup - create grade class"
        action: "create"
        model: "school_grade_class"
        save_as: "grade_class_t1"
        values:
          name: "Grade Class Billing T1"
          code: "EXTB-GC-T1"
          school_id: "REC: school_t1.id"
          grade_id: "REC: grade_t1.id"

      - step: "Setup - create student contact"
        action: "create"
        model: "res.partner"
        save_as: "contact_t1"
        values:
          name: "Student Contact Billing T1"

      - step: "Setup - create student"
        action: "create"
        model: "school_student"
        save_as: "student_t1"
        values:
          name: "Student Billing T1"
          code: "EXTB-ST-T1"
          contact_id: "REC: contact_t1.id"
          school_id: "REC: school_t1.id"

      - step: "Setup - create enrollment"
        action: "create"
        model: "school_enrollment"
        save_as: "enrollment_t1"
        values:
          academic_year_id: "REC: academic_year_t1.id"
          academic_term_id: "REC: academic_term_t1.id"
          school_id: "REC: school_t1.id"
          grade_id: "REC: grade_t1.id"
          grade_class_id: "REC: grade_class_t1.id"
          student_id: "REC: student_t1.id"
          currency_id: "REC: company.currency_id.id"

      - step: "Setup - create payment term"
        action: "create"
        model: "school_enrollment_payment_term"
        save_as: "term_t1"
        values:
          enrollment_id: "REC: enrollment_t1.id"
          name: "Term Billing T1"

      - step: "Setup - create regular detail line"
        action: "create"
        model: "school_enrollment_payment_term_detail"
        save_as: "detail_t1"
        values:
          term_id: "REC: term_t1.id"
          product_id: "REC: product_offering_t1.id"
          name: "Registration Fee Billing T1"
          account_id: "REC: income_account_t1.id"
          uom_quantity: 1.0
          price_unit: 1000000.0

      - step: "Create participant billed to enrollment"
        action: "create"
        model: "school_extracurricular_participant"
        save_as: "participant_t1"
        values:
          offering_id: "REC: offering_t1.id"
          student_id: "REC: student_t1.id"
          enrollment_id: "REC: enrollment_t1.id"
          billing_mode: "enrollment"
          product_id: "REC: product_offering_t1.id"
          uom_quantity: 1.0
          price_unit: 600000.0

      - step: "Create allocation covering the full fee on the term"
        action: "create"
        model: "school_extracurricular_participant_allocation"
        save_as: "allocation_t1"
        values:
          participant_id: "REC: participant_t1.id"
          payment_term_id: "REC: term_t1.id"
          product_id: "REC: product_offering_t1.id"
          name: "Extracurricular Fee Billing T1"
          account_id: "REC: income_account_t1.id"
          uom_quantity: 1.0
          price_unit: 600000.0

      - step: "Confirm participant"
        action: "call"
        target: "participant_t1"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve participant, opening it and creating the addendum line"
        action: "call"
        target: "participant_t1"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Assert one addendum line was created with the allocated amount"
        action: "assert"
        target: "term_t1"
        asserts:
          extra_detail_ids:
            type: "o2m"
            check: "count"
            expected_count: 1

      - step: "Assert the term totals keep regular and extra amounts separate"
        action: "assert"
        target: "term_t1"
        asserts:
          amount_untaxed:
            type: "value"
            expected: 1000000.0
          amount_extra:
            type: "value"
            expected: 600000.0
          amount_tax:
            type: "value"
            expected: 0.0
          amount_total:
            type: "value"
            expected: 1600000.0

