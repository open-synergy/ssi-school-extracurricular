        action: "call"
        target: "participant_t13"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Assert neither allocation was duplicated"
        action: "assert"
        target: "participant_t13"
        asserts:
          allocation_ids:
            type: "o2m"
            check: "count"
            expected_count: 2

      - step: "Assert term A's already-invoiced line was not duplicated"
        action: "assert"
