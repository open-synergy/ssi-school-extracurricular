options:
  auto_refresh: true

scenarios:
  - name: "Payment term totals are computed from its detail lines"
    steps:
      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type_tt"
        values:
          name: "Grade Type Term TT"
          code: "EXTTRM-GT-TT"

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school_tt"
        values:
          name: "School Term TT"
          code: "EXTTRM-SCH-TT"
          grade_type_id: "REC: grade_type_tt.id"

      - step: "Setup - create category"
        action: "create"
        model: "school_extracurricular_category"
        save_as: "category_tt"
        values:
          name: "Category Term TT"
          code: "EXTTRM-CAT-TT"

      - step: "Setup - create extracurricular"
        action: "create"
        model: "school_extracurricular"
        save_as: "extracurricular_tt"
        values:
          name: "Chess Club Term TT"
          code: "EXTTRM-EXT-TT"
          category_id: "REC: category_tt.id"
          school_id: "REC: school_tt.id"

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year_tt"
        values:
          name: "AY Term TT"
          code: "EXTTRM-AY-TT"
          date_start: 2024-07-01
          date_end: 2025-06-30

      - step: "Setup - create academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term_tt"
        values:
          name: "Term Term TT"
          code: "EXTTRM-TERM-TT"
          date_start: 2024-07-01
          date_end: 2024-12-31
          year_id: "REC: academic_year_tt.id"

      - step: "Setup - create employee for teacher"
        action: "create"
        model: "hr.employee"
        save_as: "employee_tt"
        values:
          name: "Teacher Employee Term TT"

      - step: "Setup - create teacher"
        action: "create"
        model: "school_teacher"
        save_as: "teacher_tt"
        values:
          name: "Teacher Term TT"
          code: "EXTTRM-TCH-TT"
          employee_id: "REC: employee_tt.id"

      - step: "Setup - create offering product"
        action: "create"
        model: "product.product"
        save_as: "product_tt"
        values:
          name: "Extracurricular Fee Term TT"

      - step: "Setup - create offering, billing mode standalone"
        action: "create"
        model: "school_extracurricular_offering"
        save_as: "offering_tt"
        values:
          extracurricular_id: "REC: extracurricular_tt.id"
          academic_year_id: "REC: academic_year_tt.id"
          academic_term_id: "REC: academic_term_tt.id"
          teacher_id: "REC: teacher_tt.id"
          date_start: 2024-07-01
          date_end: 2024-12-31
          product_id: "REC: product_tt.id"
          price_unit: 500000.0
          billing_mode: "standalone"

      - step: "Setup - create grade"
        action: "create"
        model: "school_grade"
        save_as: "grade_tt"
        values:
          name: "Grade Term TT"
          code: "EXTTRM-GR-TT"
          type_id: "REC: grade_type_tt.id"

      - step: "Setup - create grade class"
        action: "create"
        model: "school_grade_class"
        save_as: "grade_class_tt"
        values:
          name: "Grade Class Term TT"
          code: "EXTTRM-GC-TT"
          school_id: "REC: school_tt.id"
          grade_id: "REC: grade_tt.id"

      - step: "Setup - create student contact"
        action: "create"
        model: "res.partner"
        save_as: "contact_tt"
        values:
          name: "Student Contact Term TT"

      - step: "Setup - create student"
        action: "create"
        model: "school_student"
        save_as: "student_tt"
        values:
          name: "Student Term TT"
          code: "EXTTRM-ST-TT"
          contact_id: "REC: contact_tt.id"
          school_id: "REC: school_tt.id"

      - step: "Setup - create enrollment"
        action: "create"
        model: "school_enrollment"
        save_as: "enrollment_tt"
        values:
          academic_year_id: "REC: academic_year_tt.id"
          academic_term_id: "REC: academic_term_tt.id"
          school_id: "REC: school_tt.id"
          grade_id: "REC: grade_tt.id"
          grade_class_id: "REC: grade_class_tt.id"
          student_id: "REC: student_tt.id"

      - step: "Setup - create standalone participant"
        action: "create"
        model: "school_extracurricular_participant"
        save_as: "participant_tt"
        values:
          offering_id: "REC: offering_tt.id"
          student_id: "REC: student_tt.id"
          enrollment_id: "REC: enrollment_tt.id"
          billing_mode: "standalone"
          product_id: "REC: product_tt.id"
          uom_quantity: 1.0
          price_unit: 500000.0

      - step: "Setup - get revenue account type"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "revenue_type_tt"

      - step: "Setup - create income account"
        action: "create"
        model: "account.account"
        save_as: "income_account_tt"
        values:
          name: "Extracurricular Term Income TT"
          code: "EXTTRM-INC-TT"
          user_type_id: "REC: revenue_type_tt.id"

      - step: "Create the standalone payment term"
        action: "create"
        model: "school_extracurricular_payment_term"
        save_as: "term_tt"
        values:
          participant_id: "REC: participant_tt.id"
          name: "Term 1 Fee TT"

      - step: "Create first detail line"
        action: "create"
        model: "school_extracurricular_payment_term_detail"
        save_as: "detail_tt_1"
        values:
          term_id: "REC: term_tt.id"
          product_id: "REC: product_tt.id"
          name: "Chess Club Fee - Part 1"
          account_id: "REC: income_account_tt.id"
          uom_quantity: 1.0
          price_unit: 300000.0

      - step: "Create second detail line"
        action: "create"
        model: "school_extracurricular_payment_term_detail"
        save_as: "detail_tt_2"
        values:
          term_id: "REC: term_tt.id"
          product_id: "REC: product_tt.id"
          name: "Chess Club Fee - Part 2"
          account_id: "REC: income_account_tt.id"
          uom_quantity: 1.0
          price_unit: 200000.0

      - step: "Assert the term totals sum the two detail lines"
        action: "assert"
        target: "term_tt"
        asserts:
          amount_untaxed:
            type: "value"
            expected: 500000.0
          amount_tax:
            type: "value"
            expected: 0.0
          amount_total:
            type: "value"
            expected: 500000.0

