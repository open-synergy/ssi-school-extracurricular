        action: "create"
        model: "account.account"
        save_as: "income_account_rq"
        values:
          name: "Extracurricular Term Income RQ"
          code: "EXTTRM-INC-RQ"
          user_type_id: "REC: revenue_type_rq.id"

      # required=True on a Many2one only becomes a NOT NULL violation
      # (psycopg2.IntegrityError) on `action: create` -- not recognized
      # by the `expect_error` registry (odoo-development-unit-test
      # skill, python-escape-hatch.md L-22). `action: form` triggers
      # the same rejection through Form.save(), which is a plain
      # AssertionError the registry does understand. `account_id` is
      # filled so the rejection is unambiguously about Product.
      - step: "Detail line without Product must be rejected via the form"
        action: "form"
        model: "school_extracurricular_payment_term_detail"
        save: true
        expect_error:
          type: "AssertionError"
          message_contains: "is a required field"
        values:
          term_id: "REC: term_rq"
          name: "Chess Club Fee - No Product"
          account_id: "REC: income_account_rq"
