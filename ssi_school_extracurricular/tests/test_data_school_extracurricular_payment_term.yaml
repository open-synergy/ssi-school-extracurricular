      - step: "Setup - create grade class"
        action: "create"
        model: "school_grade_class"
        save_as: "grade_class_st"
        values:
          name: "Grade Class Term ST"
          code: "EXTTRM-GC-ST"
          school_id: "REC: school_st.id"
          grade_id: "REC: grade_st.id"

      - step: "Setup - create student contact"
        action: "create"
        model: "res.partner"
        save_as: "contact_st"
        values:
          name: "Student Contact Term ST"

      - step: "Setup - create student"
        action: "create"
        model: "school_student"
        save_as: "student_st"
        values:
          name: "Student Term ST"
          code: "EXTTRM-ST-ST"
          contact_id: "REC: contact_st.id"
          school_id: "REC: school_st.id"

      - step: "Setup - create enrollment"
        action: "create"
        model: "school_enrollment"
        save_as: "enrollment_st"
        values:
          academic_year_id: "REC: academic_year_st.id"
          academic_term_id: "REC: academic_term_st.id"
          school_id: "REC: school_st.id"
          grade_id: "REC: grade_st.id"
          grade_class_id: "REC: grade_class_st.id"
          student_id: "REC: student_st.id"

      - step: "Setup - create standalone participant"
        action: "create"
        model: "school_extracurricular_participant"
        save_as: "participant_st"
        values:
          offering_id: "REC: offering_st.id"
          student_id: "REC: student_st.id"
          enrollment_id: "REC: enrollment_st.id"
          billing_mode: "standalone"
          product_id: "REC: product_st.id"
          uom_quantity: 1.0
          price_unit: 500000.0

      - step: "Create the standalone payment term while participant is draft"
        action: "create"
        model: "school_extracurricular_payment_term"
        save_as: "term_st"
        values:
          participant_id: "REC: participant_st.id"
          name: "Term 1 Fee ST"

      - step: "Assert the term is draft while the participant is draft"
        action: "assert"
        target: "term_st"
        asserts:
          state:
            type: "value"
            expected: "draft"

      - step: "Confirm the participant"
        action: "call"
        target: "participant_st"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Assert the term is still draft while the participant is confirm"
        action: "assert"
        target: "term_st"
        asserts:
          state:
            type: "value"
            expected: "draft"

      - step: "Approve the participant"
        action: "call"
        target: "participant_st"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Assert the term becomes uninvoiced once the participant is open"
        action: "assert"
        target: "term_st"
        asserts:
          state:
            type: "value"
            expected: "uninvoiced"

      - step: "Mark the term as manually controlled"
        action: "write"
        target: "term_st"
        values:
          manually_control: true

      - step: "Assert the term state becomes manual"
        action: "assert"
        target: "term_st"
        asserts:
          state:
            type: "value"
            expected: "manual"

  - name: "Payment term detail without a product must be rejected"
    steps:
      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type_rq"
        values:
          name: "Grade Type Term RQ"
          code: "EXTTRM-GT-RQ"

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school_rq"
        values:
          name: "School Term RQ"
          code: "EXTTRM-SCH-RQ"
          grade_type_id: "REC: grade_type_rq.id"

      - step: "Setup - create category"
