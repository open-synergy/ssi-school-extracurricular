          payment_term_id: "REC: term_v3.id"
          product_id: "REC: product_offering_v3.id"
          name: "Extracurricular Fee Voided V3"
          account_id: "REC: income_account_v3.id"
          uom_quantity: 1.0
          price_unit: 500000.0

      - step: "Confirm participant"
        action: "call"
        target: "participant_v3"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve participant, opening it and creating the addendum line"
        action: "call"
        target: "participant_v3"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Confirm the enrollment"
        action: "call"
        target: "enrollment_v3"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve the enrollment"
        action: "call"
        target: "enrollment_v3"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step:
          "Assert the term is still uninvoiced, not voided, even though every regular
          detail line is voided"
        action: "assert"
        target: "term_v3"
        asserts:
          state:
            type: "value"
            expected: "uninvoiced"

      - step: "Create the customer invoice from the payment term"
        action: "call"
        target: "term_v3"
        method: "action_create_invoice"
        as_user: "base.user_admin"

      - step:
          "Assert the invoice was created with exactly one line -- the addendum line,
          since the regular one is voided"
        action: "assert"
        target: "term_v3"
        asserts:
          state:
            type: "value"
            expected: "invoiced"
          customer_invoice_id.line_ids:
            type: "o2m"
            check: "count"
            expected_count: 1

  - name:
      "A term with no addendum lines and every detail voided is fully voided and rejects
      invoicing"
    steps:
      - step: "Setup - get revenue account type"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "revenue_type_v4"

      - step: "Setup - create income account"
        action: "create"
        model: "account.account"
        save_as: "income_account_v4"
        values:
          name: "Voided Billing Income V4"
          code: "EXTV-V4-INC"
          user_type_id: "REC: revenue_type_v4.id"

      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type_v4"
        values:
          name: "Grade Type Voided V4"
          code: "EXTV-GT-V4"

      - step: "Setup - create fee product"
        action: "create"
        model: "product.product"
        save_as: "product_fee_v4"
        values:
          name: "Registration Fee Product Voided V4"

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school_v4"
        values:
          name: "School Voided V4"
          code: "EXTV-SCH-V4"
          grade_type_id: "REC: grade_type_v4.id"

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year_v4"
        values:
          name: "AY Voided V4"
          code: "EXTV-AY-V4"
          date_start: 2026-07-01
          date_end: 2027-06-30

      - step: "Setup - create academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term_v4"
        values:
          name: "Term Voided V4"
          code: "EXTV-TERM-V4"
          date_start: 2026-07-01
          date_end: 2026-12-31
          year_id: "REC: academic_year_v4.id"
          enrollment_state: "open"

      - step: "Setup - create grade"
        action: "create"
        model: "school_grade"
        save_as: "grade_v4"
        values:
          name: "Grade Voided V4"
          code: "EXTV-GR-V4"
          type_id: "REC: grade_type_v4.id"

      - step: "Setup - create grade class"
        action: "create"
        model: "school_grade_class"
        save_as: "grade_class_v4"
        values:
          name: "Grade Class Voided V4"
          code: "EXTV-GC-V4"
          school_id: "REC: school_v4.id"
          grade_id: "REC: grade_v4.id"

      - step: "Setup - create student contact"
        action: "create"
        model: "res.partner"
        save_as: "contact_v4"
        values:
          name: "Student Contact Voided V4"

      - step: "Setup - create student"
        action: "create"
        model: "school_student"
        save_as: "student_v4"
        values:
          name: "Student Voided V4"
          code: "EXTV-ST-V4"
          contact_id: "REC: contact_v4.id"
          school_id: "REC: school_v4.id"

      - step: "Setup - create enrollment"
        action: "create"
        model: "school_enrollment"
        save_as: "enrollment_v4"
        values:
          academic_year_id: "REC: academic_year_v4.id"
          academic_term_id: "REC: academic_term_v4.id"
          school_id: "REC: school_v4.id"
          grade_id: "REC: grade_v4.id"
          grade_class_id: "REC: grade_class_v4.id"
          student_id: "REC: student_v4.id"
          currency_id: "REC: company.currency_id.id"

      - step: "Setup - create payment term"
        action: "create"
        model: "school_enrollment_payment_term"
        save_as: "term_v4"
        values:
          enrollment_id: "REC: enrollment_v4.id"
          name: "Term Voided V4"

      - step:
          "Create the only regular detail line, voided at creation (its amount already
          moved to another term); no addendum line exists on this term"
        action: "create"
        model: "school_enrollment_payment_term_detail"
        save_as: "detail_v4_voided"
        values:
          term_id: "REC: term_v4.id"
          product_id: "REC: product_fee_v4.id"
          name: "Registration Fee Voided V4 Moved"
          account_id: "REC: income_account_v4.id"
          uom_quantity: 1.0
          price_unit: 1000000.0
          voided: true

      - step: "Confirm the enrollment"
        action: "call"
        target: "enrollment_v4"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve the enrollment"
        action: "call"
        target: "enrollment_v4"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Assert the term is fully voided, without any addendum line"
        action: "assert"
        target: "term_v4"
        asserts:
          state:
            type: "value"
            expected: "voided"

      - step: "Creating an invoice from a fully voided term must fail"
        action: "call"
        target: "term_v4"
        method: "action_create_invoice"
        as_user: "base.user_admin"
        expect_error:
          type: "UserError"
          message_contains: "no invoiceable detail line"
