options:
  auto_refresh: true

scenarios:
  - name: "Voided detail lines are excluded from the term totals"
    steps:
      - step: "Setup - get revenue account type"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "revenue_type_v1"

      - step: "Setup - create income account"
        action: "create"
        model: "account.account"
        save_as: "income_account_v1"
        values:
          name: "Voided Billing Income V1"
          code: "EXTV-V1-INC"
          user_type_id: "REC: revenue_type_v1.id"

      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type_v1"
        values:
          name: "Grade Type Voided V1"
          code: "EXTV-GT-V1"

      - step: "Setup - create fee product"
        action: "create"
        model: "product.product"
        save_as: "product_fee_v1"
        values:
          name: "Registration Fee Product Voided V1"

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school_v1"
        values:
          name: "School Voided V1"
          code: "EXTV-SCH-V1"
          grade_type_id: "REC: grade_type_v1.id"

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year_v1"
        values:
          name: "AY Voided V1"
          code: "EXTV-AY-V1"
          date_start: 2026-07-01
          date_end: 2027-06-30

      - step: "Setup - create academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term_v1"
        values:
          name: "Term Voided V1"
          code: "EXTV-TERM-V1"
          date_start: 2026-07-01
          date_end: 2026-12-31
          year_id: "REC: academic_year_v1.id"
          enrollment_state: "open"

      - step: "Setup - create grade"
        action: "create"
        model: "school_grade"
        save_as: "grade_v1"
        values:
          name: "Grade Voided V1"
          code: "EXTV-GR-V1"
          type_id: "REC: grade_type_v1.id"

      - step: "Setup - create grade class"
        action: "create"
        model: "school_grade_class"
        save_as: "grade_class_v1"
        values:
          name: "Grade Class Voided V1"
          code: "EXTV-GC-V1"
          school_id: "REC: school_v1.id"
          grade_id: "REC: grade_v1.id"

      - step: "Setup - create student contact"
        action: "create"
        model: "res.partner"
        save_as: "contact_v1"
        values:
          name: "Student Contact Voided V1"

      - step: "Setup - create student"
        action: "create"
        model: "school_student"
        save_as: "student_v1"
        values:
          name: "Student Voided V1"
          code: "EXTV-ST-V1"
          contact_id: "REC: contact_v1.id"
          school_id: "REC: school_v1.id"

      - step: "Setup - create enrollment"
        action: "create"
        model: "school_enrollment"
        save_as: "enrollment_v1"
        values:
          academic_year_id: "REC: academic_year_v1.id"
          academic_term_id: "REC: academic_term_v1.id"
          school_id: "REC: school_v1.id"
          grade_id: "REC: grade_v1.id"
          grade_class_id: "REC: grade_class_v1.id"
          student_id: "REC: student_v1.id"
          currency_id: "REC: company.currency_id.id"

      - step: "Setup - create payment term"
        action: "create"
        model: "school_enrollment_payment_term"
        save_as: "term_v1"
        values:
          enrollment_id: "REC: enrollment_v1.id"
          name: "Term Voided V1"

      - step: "Create a regular detail line kept invoiceable"
        action: "create"
        model: "school_enrollment_payment_term_detail"
        save_as: "detail_v1_kept"
        values:
          term_id: "REC: term_v1.id"
          product_id: "REC: product_fee_v1.id"
          name: "Registration Fee Voided V1 Kept"
          account_id: "REC: income_account_v1.id"
          uom_quantity: 1.0
          price_unit: 1000000.0

      - step:
          "Create a regular detail line whose amount already moved to another term
          (voided at creation, price_unit unchanged)"
        action: "create"
        model: "school_enrollment_payment_term_detail"
        save_as: "detail_v1_voided"
        values:
          term_id: "REC: term_v1.id"
          product_id: "REC: product_fee_v1.id"
          name: "Registration Fee Voided V1 Moved"
          account_id: "REC: income_account_v1.id"
          uom_quantity: 1.0
          price_unit: 1000000.0
          voided: true

      - step: "Assert the voided line does not count toward the totals"
        action: "assert"
        target: "term_v1"
        asserts:
          amount_untaxed:
            type: "value"
            expected: 1000000.0
          amount_total:
            type: "value"
            expected: 1000000.0

