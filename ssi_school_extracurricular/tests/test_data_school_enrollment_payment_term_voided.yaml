          product_id: "REC: product_offering_v2.id"
          name: "Registration Fee Voided V2 Moved"
          account_id: "REC: income_account_v2.id"
          uom_quantity: 1.0
          price_unit: 1000000.0
          voided: true

      - step: "Create participant billed to enrollment"
        action: "create"
        model: "school_extracurricular_participant"
        save_as: "participant_v2"
        values:
          offering_id: "REC: offering_v2.id"
          student_id: "REC: student_v2.id"
          enrollment_id: "REC: enrollment_v2.id"
          billing_mode: "enrollment"
          product_id: "REC: product_offering_v2.id"
          uom_quantity: 1.0
          price_unit: 500000.0

      - step: "Create allocation covering the full addendum fee"
        action: "create"
        model: "school_extracurricular_participant_allocation"
        save_as: "allocation_v2"
        values:
          participant_id: "REC: participant_v2.id"
          payment_term_id: "REC: term_v2.id"
          product_id: "REC: product_offering_v2.id"
          name: "Extracurricular Fee Voided V2"
          account_id: "REC: income_account_v2.id"
          uom_quantity: 1.0
          price_unit: 500000.0

      - step: "Confirm participant"
        action: "call"
        target: "participant_v2"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve participant, opening it and creating the addendum line"
        action: "call"
        target: "participant_v2"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step:
          "Assert the voided regular line is excluded, and the addendum line is added to
          amount_extra and amount_total in full"
        action: "assert"
        target: "term_v2"
        asserts:
          amount_untaxed:
            type: "value"
            expected: 1000000.0
          amount_extra:
            type: "value"
            expected: 500000.0
          amount_total:
            type: "value"
            expected: 1500000.0

  - name:
      "A term fully voided on regular lines but still billing an addendum line stays
      invoiceable"
    steps:
      - step: "Setup - get sale journal"
        action: "search"
        model: "account.journal"
        domain: [["type", "=", "sale"]]
        save_as: "journal_v3"
        limit: 1

      - step: "Setup - get revenue account type"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "revenue_type_v3"

      - step: "Setup - get receivable account type"
        action: "ref"
        xml_id: "account.data_account_type_receivable"
        save_as: "receivable_type_v3"

      - step: "Setup - create income account"
        action: "create"
