      - step: "Setup - create the student's enrollment for the term"
        action: "create"
        model: "school_enrollment"
        save_as: "ecou4_enrollment"
        values:
          academic_year_id: "REC: ecou4_academic_year.id"
          academic_term_id: "REC: ecou4_academic_term.id"
          school_id: "REC: ecou4_school.id"
          grade_id: "REC: ecou4_grade.id"
          grade_class_id: "REC: ecou4_grade_class.id"
