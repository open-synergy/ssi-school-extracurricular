          code: "ECOU4-AY"
          date_start: 2026-07-01
          date_end: 2027-06-30

      - step: "Setup - create academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "ecou4_academic_term"
        values:
          name: "Term ECOU4"
          code: "ECOU4-TERM"
          date_start: 2026-07-01
          date_end: 2026-12-31
          year_id: "REC: ecou4_academic_year.id"

      - step: "Setup - create employee for teacher"
        action: "create"
