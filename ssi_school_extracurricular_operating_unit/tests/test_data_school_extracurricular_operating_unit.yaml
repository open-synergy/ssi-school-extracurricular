          extracurricular_id: "REC: ecou3_extracurricular.id"
          academic_year_id: "REC: ecou3_academic_year.id"
          academic_term_id: "REC: ecou3_academic_term.id"
          teacher_id: "REC: ecou3_teacher.id"
          date_start: 2026-07-01
          date_end: 2026-12-31
          product_id: "REC: ecou3_product.id"
          price_unit: 150000.0
          operating_unit_id: "REC: ecou3_ou_a.id"

      - step: "Create offering B, at Operating Unit B, owned by admin"
        action: "create"
        model: "school_extracurricular_offering"
        save_as: "ecou3_offering_b"
        as_user: "base.user_admin"
        values:
          extracurricular_id: "REC: ecou3_extracurricular.id"
          academic_year_id: "REC: ecou3_academic_year.id"
          academic_term_id: "REC: ecou3_academic_term.id"
          teacher_id: "REC: ecou3_teacher.id"
          date_start: 2026-07-01
          date_end: 2026-12-31
          product_id: "REC: ecou3_product.id"
          price_unit: 150000.0
          operating_unit_id: "REC: ecou3_ou_b.id"

      # The restricted user is deliberately NOT put in ``base.group_user``:
      # this base module's own Company rule
      # (``school_extracurricular_offering_company_rule``) is scoped to
      # ``base.group_user`` and would OR its ``company_id`` domain back
      # into every group-rule the user belongs to, masking the Operating
      # Unit rule's restriction entirely for any user who is also a
      # generic internal user of the same company. Leaving it out means
      # this Operating Unit rule is the ONLY active group rule for this
      # user, so the assertion below is unambiguously caused by it.
      - step: "Create a user restricted to Operating Unit A only"
        action: "create"
        model: "res.users"
        save_as: "ecou3_restricted_user"
        values:
          name: "ECOU3 Restricted User"
          login: "ecou3_restricted_user@example.com"
          groups_id:
            - - 6
              - 0
              - - "REF:
                  ssi_school_extracurricular.school_extracurricular_offering_user_group"
                - "REF:
                  ssi_school_extracurricular_operating_unit.school_extracurricular_operating_unit_group"
          assigned_operating_unit_ids: [[6, 0, ["REC: ecou3_ou_a.id"]]]

      - step: "Restricted user searches for offering B (Operating Unit B) -- excluded"
        action: "search"
        model: "school_extracurricular_offering"
        domain: [["id", "=", "REC: ecou3_offering_b.id"]]
        save_as: "ecou3_search_b"
        as_user: "ecou3_restricted_user"
        expect_count: 0

      - step: "Restricted user searches for offering A (Operating Unit A) -- visible"
        action: "search"
        model: "school_extracurricular_offering"
        domain: [["id", "=", "REC: ecou3_offering_a.id"]]
        save_as: "ecou3_search_a"
        as_user: "ecou3_restricted_user"
        expect_count: 1

  - name:
      "Wizard rejects consolidating due terms from participants with different Operating
      Units"
    steps:
      - step: "Get main company"
        action: "ref"
        xml_id: "base.main_company"
