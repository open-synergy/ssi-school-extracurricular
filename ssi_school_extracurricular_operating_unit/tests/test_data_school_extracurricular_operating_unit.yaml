          price_unit: 200000.0

      - step: "Create the wizard for the consolidated student"
        action: "create"
        model: "school_extracurricular_create_due_invoice"
        save_as: "ecou4_wizard"
        values:
          student_id: "REC: ecou4_student.id"
          date_invoice: 2026-06-01
          date_due_max: 2026-06-30

      # Negative: both due terms are picked up (same Journal/Account/Type),
      # but their participants disagree on Operating Unit -- the wizard
      # must refuse rather than pick one Operating Unit silently.
      - step: "Running the wizard is rejected because of the Operating Unit mismatch"
        action: "call"
        target: "ecou4_wizard"
        method: "action_create_invoice"
        as_user: "base.user_admin"
        expect_error:
          type: "UserError"
          message_contains: "do not share the same"
