options:
  auto_refresh: true

scenarios:
  - name:
      "Operating Unit onchange from Offering, still editable, and Route A propagation to
      the addendum fee line"
    steps:
      - step: "Get main company"
        action: "ref"
        xml_id: "base.main_company"
        save_as: "ecou1_company"

      - step: "Create partner for Operating Unit A"
        action: "create"
        model: "res.partner"
        save_as: "ecou1_ou_a_partner"
        values:
          name: "ECOU1 Operating Unit A Partner"

      - step: "Create Operating Unit A"
        action: "create"
        model: "operating.unit"
        save_as: "ecou1_ou_a"
        values:
          name: "ECOU1 Operating Unit A"
          code: "ECOU1A"
          company_id: "REC: ecou1_company.id"
          partner_id: "REC: ecou1_ou_a_partner.id"

      - step: "Create partner for Operating Unit B"
        action: "create"
        model: "res.partner"
        save_as: "ecou1_ou_b_partner"
        values:
          name: "ECOU1 Operating Unit B Partner"

      - step: "Create Operating Unit B"
        action: "create"
        model: "operating.unit"
        save_as: "ecou1_ou_b"
        values:
          name: "ECOU1 Operating Unit B"
          code: "ECOU1B"
          company_id: "REC: ecou1_company.id"
          partner_id: "REC: ecou1_ou_b_partner.id"

      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "ecou1_grade_type"
        values:
          name: "Grade Type ECOU1"
          code: "ECOU1-GT"

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "ecou1_school"
        values:
          name: "School ECOU1"
          code: "ECOU1-SCH"
          grade_type_id: "REC: ecou1_grade_type.id"

      - step: "Setup - create category"
        action: "create"
        model: "school_extracurricular_category"
        save_as: "ecou1_category"
        values:
          name: "Category ECOU1"
          code: "ECOU1-CAT"

      - step: "Setup - create extracurricular"
        action: "create"
        model: "school_extracurricular"
        save_as: "ecou1_extracurricular"
        values:
          name: "Futsal Club ECOU1"
          code: "ECOU1-EXT"
          category_id: "REC: ecou1_category.id"
          school_id: "REC: ecou1_school.id"

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "ecou1_academic_year"
        values:
          name: "AY ECOU1"
          code: "ECOU1-AY"
          date_start: 2026-07-01
          date_end: 2027-06-30

      - step: "Setup - create academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "ecou1_academic_term"
        values:
          name: "Term ECOU1"
          code: "ECOU1-TERM"
          date_start: 2026-07-01
          date_end: 2026-12-31
          year_id: "REC: ecou1_academic_year.id"

      - step: "Setup - create employee for teacher"
        action: "create"
        model: "hr.employee"
        save_as: "ecou1_employee"
        values:
          name: "Teacher Employee ECOU1"

      - step: "Setup - create teacher"
        action: "create"
        model: "school_teacher"
        save_as: "ecou1_teacher"
        values:
          name: "Teacher ECOU1"
          code: "ECOU1-TCH"
          employee_id: "REC: ecou1_employee.id"

      - step: "Setup - create offering product"
        action: "create"
        model: "product.product"
        save_as: "ecou1_product"
        values:
          name: "Extracurricular Fee ECOU1"

      - step: "Create offering at Operating Unit A"
        action: "create"
        model: "school_extracurricular_offering"
        save_as: "ecou1_offering"
        values:
          extracurricular_id: "REC: ecou1_extracurricular.id"
          academic_year_id: "REC: ecou1_academic_year.id"
          academic_term_id: "REC: ecou1_academic_term.id"
          teacher_id: "REC: ecou1_teacher.id"
          date_start: 2026-07-01
          date_end: 2026-12-31
          product_id: "REC: ecou1_product.id"
          price_unit: 150000.0
          operating_unit_id: "REC: ecou1_ou_a.id"

      - step: "Setup - create grade"
        action: "create"
        model: "school_grade"
        save_as: "ecou1_grade"
        values:
          name: "Grade ECOU1"
          code: "ECOU1-GR"
          type_id: "REC: ecou1_grade_type.id"

      - step: "Setup - create grade class"
        action: "create"
        model: "school_grade_class"
        save_as: "ecou1_grade_class"
        values:
          name: "Grade Class ECOU1"
          code: "ECOU1-GC"
          school_id: "REC: ecou1_school.id"
          grade_id: "REC: ecou1_grade.id"

      - step: "Setup - create student contact"
        action: "create"
        model: "res.partner"
        save_as: "ecou1_contact"
        values:
          name: "Student Contact ECOU1"

      - step: "Setup - create student"
        action: "create"
        model: "school_student"
        save_as: "ecou1_student"
        values:
          name: "Student ECOU1"
          code: "ECOU1-ST"
          contact_id: "REC: ecou1_contact.id"
          school_id: "REC: ecou1_school.id"

      - step: "Setup - create enrollment"
        action: "create"
        model: "school_enrollment"
        save_as: "ecou1_enrollment"
        values:
          academic_year_id: "REC: ecou1_academic_year.id"
          academic_term_id: "REC: ecou1_academic_term.id"
          school_id: "REC: ecou1_school.id"
          grade_id: "REC: ecou1_grade.id"
          grade_class_id: "REC: ecou1_grade_class.id"
          student_id: "REC: ecou1_student.id"

      # Positive: selecting the Offering on the form copies its Operating
      # Unit via onchange (docs/school_extracurricular_participant/
      # 01-create.md, Additional Fields).
      - step: "Open a new participant form and select the Offering"
        action: "form"
        model: "school_extracurricular_participant"
        save: false
        values:
          offering_id: "REC: ecou1_offering"
        asserts:
          operating_unit_id:
            type: "m2o"
            expected: "REC: ecou1_ou_a"

      # Positive: the copied value is still editable -- create the real
      # participant at Operating Unit B, different from its Offering's
      # Operating Unit A.
      - step: "Create the participant, then change its Operating Unit to B"
        action: "create"
        model: "school_extracurricular_participant"
        save_as: "ecou1_participant"
        values:
          offering_id: "REC: ecou1_offering.id"
          student_id: "REC: ecou1_student.id"
          enrollment_id: "REC: ecou1_enrollment.id"
          billing_mode: "enrollment"
          product_id: "REC: ecou1_product.id"
          uom_quantity: 1.0
          price_unit: 600000.0
          operating_unit_id: "REC: ecou1_ou_b.id"

      - step: "The participant kept the explicitly chosen Operating Unit B"
        action: "assert"
        target: "ecou1_participant"
        asserts:
          operating_unit_id:
            type: "m2o"
            expected: "REC: ecou1_ou_b"

      - step: "Create the enrollment payment term to allocate the fee to"
        action: "create"
        model: "school_enrollment_payment_term"
        save_as: "ecou1_term"
        values:
          enrollment_id: "REC: ecou1_enrollment.id"
          name: "Term ECOU1"

      - step: "Setup - get revenue account type"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "ecou1_revenue_type"

      - step: "Setup - create income account"
        action: "create"
        model: "account.account"
        save_as: "ecou1_income_account"
        values:
          name: "Extracurricular Income ECOU1"
          code: "ECOU1-INC"
          user_type_id: "REC: ecou1_revenue_type.id"

      - step: "Allocate the participant's fee to the payment term"
        action: "create"
        model: "school_extracurricular_participant_allocation"
        save_as: "ecou1_allocation"
        values:
          participant_id: "REC: ecou1_participant.id"
          payment_term_id: "REC: ecou1_term.id"
          product_id: "REC: ecou1_product.id"
          name: "Extracurricular Fee ECOU1"
          account_id: "REC: ecou1_income_account.id"
          uom_quantity: 1.0
          price_unit: 600000.0

      - step: "Confirm the participant"
        action: "call"
        target: "ecou1_participant"
        method: "action_confirm"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve the participant (opens it, creates the addendum line)"
        action: "call"
        target: "ecou1_participant"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "open"

      # Positive: the addendum fee line created on the payment term
      # (Route A) carries the participant's own Operating Unit B, not the
      # Offering's Operating Unit A and not the creating user's default.
      - step: "The addendum fee line carries the participant's Operating Unit"
        action: "assert"
        target: "ecou1_allocation"
        asserts:
          extra_detail_id.operating_unit_id:
            type: "m2o"
            expected: "REC: ecou1_ou_b"

  - name: "Route B invoice inherits the participant's Operating Unit"
    steps:
      - step: "Get main company"
        action: "ref"
