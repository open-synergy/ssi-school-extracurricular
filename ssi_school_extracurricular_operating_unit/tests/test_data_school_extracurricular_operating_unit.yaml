          code: "ECOU2-ST"
          contact_id: "REC: ecou2_contact.id"
          school_id: "REC: ecou2_school.id"

      - step: "Setup - create the student's enrollment for the term"
        action: "create"
        model: "school_enrollment"
        save_as: "ecou2_enrollment"
        values:
          academic_year_id: "REC: ecou2_academic_year.id"
          academic_term_id: "REC: ecou2_academic_term.id"
          school_id: "REC: ecou2_school.id"
          grade_id: "REC: ecou2_grade.id"
          grade_class_id: "REC: ecou2_grade_class.id"
          student_id: "REC: ecou2_student.id"

      - step: "Create the participant at the Operating Unit"
        action: "create"
        model: "school_extracurricular_participant"
        save_as: "ecou2_participant"
        values:
          offering_id: "REC: ecou2_offering.id"
          student_id: "REC: ecou2_student.id"
          enrollment_id: "REC: ecou2_enrollment.id"
          billing_mode: "standalone"
          product_id: "REC: ecou2_product.id"
          uom_quantity: 1.0
          price_unit: 300000.0
          operating_unit_id: "REC: ecou2_ou.id"

      - step: "Confirm the participant"
        action: "call"
        target: "ecou2_participant"
        method: "action_confirm"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve the participant"
        action: "call"
        target: "ecou2_participant"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Create the payment term for the participant"
        action: "create"
        model: "school_extracurricular_payment_term"
        save_as: "ecou2_term"
        values:
          participant_id: "REC: ecou2_participant.id"
          name: "Chess Club Term ECOU2"
          date_due: 2026-06-15

      - step: "Create the detail line for the term"
        action: "create"
        model: "school_extracurricular_payment_term_detail"
        save_as: "ecou2_detail"
        values:
          term_id: "REC: ecou2_term.id"
          product_id: "REC: ecou2_product.id"
          name: "Chess Club Fee ECOU2"
          account_id: "REC: ecou2_income_account.id"
          uom_quantity: 1.0
          price_unit: 300000.0

      - step: "Create the wizard for the student"
        action: "create"
        model: "school_extracurricular_create_due_invoice"
        save_as: "ecou2_wizard"
        values:
          student_id: "REC: ecou2_student.id"
          date_invoice: 2026-06-01
          date_due_max: 2026-06-30

      - step: "Run the wizard"
        action: "call"
        target: "ecou2_wizard"
        method: "action_create_invoice"
        as_user: "base.user_admin"

      # Positive: the invoice created by Route B carries the
