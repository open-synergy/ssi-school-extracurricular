          customer_invoice_type_id: "REC: ecou4_invoice_type.id"
          receivable_journal_id: "REC: ecou4_journal.id"
          receivable_account_id: "REC: ecou4_receivable_account.id"

      - step: "Setup - create second offering, same accounting setup"
        action: "create"
        model: "school_extracurricular_offering"
        save_as: "ecou4_offering_2"
        values:
          extracurricular_id: "REC: ecou4_extracurricular_2.id"
          academic_year_id: "REC: ecou4_academic_year.id"
          academic_term_id: "REC: ecou4_academic_term.id"
          teacher_id: "REC: ecou4_teacher.id"
          date_start: 2026-07-01
          date_end: 2026-12-31
          product_id: "REC: ecou4_product_2.id"
          price_unit: 200000.0
          billing_mode: "standalone"
          customer_invoice_type_id: "REC: ecou4_invoice_type.id"
          receivable_journal_id: "REC: ecou4_journal.id"
          receivable_account_id: "REC: ecou4_receivable_account.id"

      - step: "Setup - create grade"
        action: "create"
        model: "school_grade"
        save_as: "ecou4_grade"
        values:
          name: "Grade ECOU4"
          code: "ECOU4-GR"
          type_id: "REC: ecou4_grade_type.id"

      - step: "Setup - create grade class"
        action: "create"
        model: "school_grade_class"
        save_as: "ecou4_grade_class"
        values:
          name: "Grade Class ECOU4"
          code: "ECOU4-GC"
          school_id: "REC: ecou4_school.id"
          grade_id: "REC: ecou4_grade.id"

      - step: "Setup - create student contact"
        action: "create"
        model: "res.partner"
        save_as: "ecou4_contact"
        values:
          name: "Student Contact ECOU4"

      - step: "Setup - create student"
        action: "create"
        model: "school_student"
        save_as: "ecou4_student"
        values:
