        values:
          name: "Chess Club ECOU2"
          code: "ECOU2-EXT"
          category_id: "REC: ecou2_category.id"
          school_id: "REC: ecou2_school.id"

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "ecou2_academic_year"
        values:
          name: "AY ECOU2"
          code: "ECOU2-AY"
          date_start: 2026-07-01
          date_end: 2027-06-30

      - step: "Setup - create academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "ecou2_academic_term"
        values:
          name: "Term ECOU2"
          code: "ECOU2-TERM"
          date_start: 2026-07-01
          date_end: 2026-12-31
          year_id: "REC: ecou2_academic_year.id"

      - step: "Setup - create employee for teacher"
        action: "create"
        model: "hr.employee"
        save_as: "ecou2_employee"
        values:
          name: "Teacher Employee ECOU2"

      - step: "Setup - create teacher"
        action: "create"
        model: "school_teacher"
        save_as: "ecou2_teacher"
        values:
          name: "Teacher ECOU2"
          code: "ECOU2-TCH"
          employee_id: "REC: ecou2_employee.id"

      - step: "Setup - create offering product"
        action: "create"
        model: "product.product"
        save_as: "ecou2_product"
        values:
          name: "Chess Club Fee ECOU2"

      - step: "Setup - get revenue account type"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "ecou2_revenue_type"

      - step: "Setup - create income account"
        action: "create"
        model: "account.account"
        save_as: "ecou2_income_account"
        values:
          name: "Extracurricular Income ECOU2"
          code: "ECOU2-INC"
          user_type_id: "REC: ecou2_revenue_type.id"

      - step: "Setup - get receivable account type"
        action: "ref"
        xml_id: "account.data_account_type_receivable"
        save_as: "ecou2_receivable_type"

      - step: "Setup - create receivable account"
        action: "create"
