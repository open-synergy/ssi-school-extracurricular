          code: "/"
          journal_id: "REC: ecou2_journal.id"
          receivable_account_id: "REC: ecou2_receivable_account.id"

      - step: "Create offering, billing mode standalone, at the Operating Unit"
        action: "create"
        model: "school_extracurricular_offering"
        save_as: "ecou2_offering"
        values:
          extracurricular_id: "REC: ecou2_extracurricular.id"
          academic_year_id: "REC: ecou2_academic_year.id"
          academic_term_id: "REC: ecou2_academic_term.id"
          teacher_id: "REC: ecou2_teacher.id"
          date_start: 2026-07-01
          date_end: 2026-12-31
          product_id: "REC: ecou2_product.id"
          price_unit: 300000.0
          billing_mode: "standalone"
          customer_invoice_type_id: "REC: ecou2_invoice_type.id"
          receivable_journal_id: "REC: ecou2_journal.id"
          receivable_account_id: "REC: ecou2_receivable_account.id"

      - step: "Setup - create grade"
        action: "create"
        model: "school_grade"
        save_as: "ecou2_grade"
        values:
          name: "Grade ECOU2"
          code: "ECOU2-GR"
          type_id: "REC: ecou2_grade_type.id"

      - step: "Setup - create grade class"
        action: "create"
        model: "school_grade_class"
        save_as: "ecou2_grade_class"
        values:
